# DigitalOcean App Platform blueprint — Fase 1 do headless: cutover por SUBDOMÍNIOS.
#
# ⚠️ Este é o TEMPLATE de PRODUÇÃO (domínio no apex real). Para validar primeiro
#    em ALPHA use o blueprint de referência `.do/app.alpha-subdomains.yaml`
#    (loja em `alpha.nelsonboulangerie.com.br`, pagamentos mock).
#
# Topologia (desacoplado por domínio — a loja fica no apex `/`):
#   STORE_DOMAIN            → storefront-nuxt (loja Nuxt)        [apex, PRIMARY]
#   api.STORE_DOMAIN        → web (Django headless: /api, webhooks, health)
#   admin.STORE_DOMAIN      → web (Django admin/operador)
#   pdv.STORE_DOMAIN        → pos-nuxt        (PDV)
#   kds.STORE_DOMAIN        → kds-nuxt        (cozinha)
#   gestor.STORE_DOMAIN     → orders-nuxt     (gestor de pedidos)
#   prod.STORE_DOMAIN       → production-nuxt (produção/fornadas)
#   compras.STORE_DOMAIN    → purchase-nuxt   (compras)
#   central.STORE_DOMAIN    → hub-nuxt        (Central de Apps)
#   mkt.STORE_DOMAIN        → marketing-nuxt  (marketing)
#   bi.STORE_DOMAIN         → bi-nuxt         (B.I.)
#
# ⚠️ Este bloco já descreveu só as quatro primeiras linhas, enquanto a loja viva
#    rodava dez superfícies. Um blueprint que descreve menos do que existe não é
#    um blueprint incompleto — é um que, se usado, entrega uma padaria sem
#    cozinha, sem gestor de pedidos e sem produção. A topologia de referência é
#    a mesma do `.do/app.alpha-subdomains.yaml`.
#
# COMO USAR:
#   1. Troque TODAS as ocorrências de `STORE_DOMAIN` pelo seu domínio real
#      (ex.: `sed -i '' 's/STORE_DOMAIN/nelson.com.br/g' .do/app.subdomains.yaml`).
#   2. No registrador/zona DNS, aponte o apex + os CNAMEs (api/admin/pos) para o app
#      (o painel da DO mostra os alvos ao adicionar cada domínio).
#   3. Valide o TEMPLATE com `doctl apps spec validate .do/app.subdomains.yaml`.
#   4. Para app novo, crie a partir do template preenchido. Para app vivo existente,
#      NAO rode `apps update --spec .do/app.subdomains.yaml`: capture o spec vivo com
#      `apps spec get`, preserve SECRET/EV[...] e valide com
#      `doctl apps propose --spec /tmp/spec-vivo.yaml --app <APP_ID>` antes do update.
#   5. Secrets (DB/Redis/pagamento/ManyChat) entram como variáveis ENCRIPTADAS no painel —
#      NUNCA neste arquivo. Ver docs/guides/deploy-digitalocean.md.
#
# ⚠️ PAGAMENTOS: este blueprint herda os adapters MOCK (verificação). Para PRODUÇÃO,
#    troque SHOPMAN_PIX_ADAPTER/SHOPMAN_CARD_ADAPTER pelos reais e desligue os mocks
#    + SHOPMAN_EXPOSE_DEBUG_OTP. Recomendado: validar o modelo cross-domain em staging
#    (subdomínios) ANTES de virar a produção.
name: shopman-headless
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: STORE_DOMAIN
    type: PRIMARY
    zone: STORE_DOMAIN
  - domain: api.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN
  - domain: admin.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN
  - domain: pdv.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN
  - domain: kds.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN
  - domain: gestor.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN
  - domain: prod.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN
  - domain: compras.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN
  - domain: central.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN
  - domain: mkt.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN
  - domain: bi.STORE_DOMAIN
    type: ALIAS
    zone: STORE_DOMAIN

ingress:
  rules:
    # Django headless (API + webhooks + health) — host api.
    - match:
        authority:
          exact: api.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: web
    # Django admin/operador — host admin.
    - match:
        authority:
          exact: admin.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: web
    # PDV Nuxt — host pdv.
    - match:
        authority:
          exact: pdv.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: pos-nuxt
    # kds-nuxt — host kds.
    - match:
        authority:
          exact: kds.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: kds-nuxt
    # orders-nuxt — host gestor.
    - match:
        authority:
          exact: gestor.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: orders-nuxt
    # production-nuxt — host prod.
    - match:
        authority:
          exact: prod.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: production-nuxt
    # purchase-nuxt — host compras.
    - match:
        authority:
          exact: compras.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: purchase-nuxt
    # hub-nuxt — host central.
    - match:
        authority:
          exact: central.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: hub-nuxt
    # marketing-nuxt — host mkt.
    - match:
        authority:
          exact: mkt.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: marketing-nuxt
    # bi-nuxt — host bi.
    - match:
        authority:
          exact: bi.STORE_DOMAIN
        path:
          prefix: /
      component:
        name: bi-nuxt
    # Loja Nuxt — apex (em /). Última regra = catch-all do domínio primário.
    - match:
        path:
          prefix: /
      component:
        name: storefront-nuxt

envs:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings
    scope: RUN_TIME
    type: GENERAL
  - key: DJANGO_DEBUG
    value: "false"
    scope: RUN_TIME
    type: GENERAL
  # Django só é servido em api./admin. (a loja/PDV falam com ele via BFF/admin direto).
  - key: DJANGO_ALLOWED_HOSTS
    value: "api.STORE_DOMAIN,admin.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  # CSRF: o BFF mascara origin=api. (loja/PDV); o admin é acessado direto em admin.
  - key: CSRF_TRUSTED_ORIGINS
    value: "https://api.STORE_DOMAIN,https://admin.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: DJANGO_TRUST_X_FORWARDED_PROTO
    value: "true"
    scope: RUN_TIME
    type: GENERAL
  - key: DJANGO_SECURE_SSL_REDIRECT
    value: "true"
    scope: RUN_TIME
    type: GENERAL
  # FONTE ÚNICA dos links de cliente = o apex (a loja). Vira tudo de uma vez.
  - key: SHOPMAN_STOREFRONT_BASE_URL
    value: "https://STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_DOMAIN
    value: "https://STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: AUTH_DEFAULT_DOMAIN
    value: "STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  # ── Superfícies de operador ────────────────────────────────────────────
  # O cookie de sessão do operador é emitido no DOMÍNIO-PAI para valer nos
  # subdomínios (pdv./kds./gestor./prod./compras./central./mkt./bi.). Sem esta
  # chave o operador precisa entrar de novo em cada superfície — e o
  # `check_operator_cookie_domain` (SHOPMAN_E014) reprova o deploy.
  - key: SHOPMAN_OPERATOR_COOKIE_DOMAIN
    value: ".STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_OPERATOR_API_HOST
    value: "api.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_ADMIN_HOST
    value: "admin.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  # Os endereços que o Django usa para APONTAR de uma superfície para outra
  # (Central de Apps, links em alerta e notificação de operador).
  - key: SHOPMAN_POS_BASE_URL
    value: "https://pdv.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_KDS_BASE_URL
    value: "https://kds.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_ORDERS_BASE_URL
    value: "https://gestor.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_PRODUCTION_BASE_URL
    value: "https://prod.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_PURCHASE_BASE_URL
    value: "https://compras.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_MARKETING_BASE_URL
    value: "https://mkt.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_BI_BASE_URL
    value: "https://bi.STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: WHATSAPP_STOREFRONT_URL
    value: "https://STORE_DOMAIN"
    scope: RUN_TIME
    type: GENERAL
  - key: DOORMAN_MESSAGE_SENDER_CLASS
    value: shopman.doorman.senders.LogSender
    scope: RUN_TIME
    type: GENERAL
  - key: DATABASE_URL
    value: "${postgres.shopman-headless-pool.DATABASE_URL}"
    scope: RUN_TIME
    type: GENERAL
  - key: DATABASE_CONN_MAX_AGE
    value: "60"
    scope: RUN_TIME
    type: GENERAL
  - key: DATABASE_DISABLE_SERVER_SIDE_CURSORS
    value: "true"
    scope: RUN_TIME
    type: GENERAL
  - key: REDIS_URL
    value: "${cache.REDIS_URL}"
    scope: RUN_TIME
    type: GENERAL
  # ⚠️ MOCK (verificação). Troque pelos adapters reais em produção.
  - key: SHOPMAN_PIX_ADAPTER
    value: shopman.shop.adapters.payment_mock
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_CARD_ADAPTER
    value: shopman.shop.adapters.payment_mock
    scope: RUN_TIME
    type: GENERAL
  # false em produção: com SHOPMAN_ENVIRONMENT=production e adapters ainda em
  # payment_mock, o deploy-check SHOPMAN_E003 FALHA o PRE_DEPLOY de propósito —
  # forçando a troca por SHOPMAN_PIX_ADAPTER/SHOPMAN_CARD_ADAPTER reais antes de subir.
  - key: SHOPMAN_ALLOW_MOCK_PAYMENT_ADAPTERS
    value: "false"
    scope: RUN_TIME
    type: GENERAL
  # false em produção, e não por redundância: enquanto o E003 barra o
  # payment_mock isto é inerte, mas fica PRÉ-ARMADO — no dia em que alguém
  # ligar SHOPMAN_ALLOW_MOCK_PAYMENT_ADAPTERS=true para destravar um deploy,
  # todo PIX passa a se autoconfirmar de graça. A primeira trava é justamente
  # a que será desligada sob pressão.
  - key: SHOPMAN_MOCK_PIX_AUTO_CONFIRM
    value: "false"
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_MOCK_PIX_CONFIRM_DELAY_SECONDS
    value: "8"
    scope: RUN_TIME
    type: GENERAL
  - key: STRIPE_CAPTURE_METHOD
    value: manual
    scope: RUN_TIME
    type: GENERAL
  - key: SHOPMAN_JSON_LOGS
    value: "true"
    scope: RUN_TIME
    type: GENERAL
  # production: liga os deploy-checks estritos (E003 pagamento mock, E010 OTP debug).
  # Este é o TEMPLATE de produção; o deploy-check vai barrar até os adapters/segredos
  # reais entrarem — comportamento desejado, não bug.
  - key: SHOPMAN_ENVIRONMENT
    value: production
    scope: RUN_TIME
    type: GENERAL
  # false em produção: nunca expor OTP no corpo da resposta em produção (E010).
  - key: SHOPMAN_EXPOSE_DEBUG_OTP
    value: "false"
    scope: RUN_TIME
    type: GENERAL
  # Rate-limit por IP atrás da DO App Platform: o rightmost do X-Forwarded-For é
  # um nó de ingress que rotaciona, então com depth=1 uma request de um cliente
  # cai em buckets diferentes e o limite se dilui. Descubra o depth em STAGING
  # (SHOPMAN_LOG_CLIENT_IP=true → linha `client_ip.diagnostic` → posição do IP
  # real na cadeia `xff=` contando da direita) e replique o número aqui.
  # NÃO ligue SHOPMAN_LOG_CLIENT_IP em produção (loga IP de cliente = dado pessoal).
  # - key: DOORMAN_TRUSTED_PROXY_DEPTH
  #   value: "2"
  #   scope: RUN_TIME
  #   type: GENERAL

services:
  - name: web
    git:
      repo_clone_url: https://github.com/nelsonboulangerie/django-shopman.git
      branch: main
    dockerfile_path: Dockerfile
    source_dir: /
    # ⚠️ `--access-log=/dev/null` NÃO é economia de log: é vazamento de segredo.
    # O access log do daphne grava o request-target CRU, com query string
    # (daphne/http_protocol.py: "path": uri), e o token dos webhooks viaja na query
    # — `?token=<EFI_WEBHOOK_TOKEN>` — porque é assim que a EFI cadastra a URL.
    # Esse token é a autenticação ÚNICA do webhook de Pix (a allowlist de IP nasce
    # vazia e o mTLS é advisory), então cada chamada legítima da EFI escrevia o
    # segredo em texto puro no stream de log da plataforma. Quem lê o log forja
    # "Pix recebido" e o pedido se paga sozinho.
    # O `before_send` do Sentry redige isso PARA O SENTRY; não faz nada pelo stdout.
    # Verbosity fica em 1: o log da APLICAÇÃO segue em INFO, só o access log morre.
    run_command: daphne -b 0.0.0.0 -p 8000 --access-log=/dev/null config.asgi:application
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /ready/
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    liveness_health_check:
      http_path: /health/
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: TEN_MINUTES
  - name: storefront-nuxt
    git:
      repo_clone_url: https://github.com/nelsonboulangerie/django-shopman.git
      branch: main
    source_dir: /surfaces/storefront-nuxt
    build_command: npm ci && npm run build
    run_command: node .output/server/index.mjs
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      # O BFF proxia para o Django no host api. (cross-domain resolvido server-side).
      - key: NUXT_DJANGO_BASE_URL
        value: "https://api.STORE_DOMAIN"
        scope: RUN_TIME
        type: GENERAL
      # A loja vive na RAIZ do apex.
      - key: NUXT_APP_BASE_URL
        value: /
        scope: RUN_TIME
        type: GENERAL
    health_check:
      http_path: /menu
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: TEN_MINUTES
  - name: pos-nuxt
    git:
