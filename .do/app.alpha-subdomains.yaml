# DigitalOcean App Platform - ALPHA tecnico (spec versionado de referencia).
#
# Derivado do spec vivo capturado em
# ~/Dev/Claude/shopman-alpha-specs-2026-08-22/03-live-spec-final-shopman-alpha.yaml.
#
# NAO aplicar este arquivo diretamente com `doctl apps update --spec`: payloads
# SECRET encriptados foram removidos de proposito. Mudancas de configuracao devem
# partir de `doctl apps spec get` do app vivo, preservar os secrets e so entao
# aplicar. Deploy de codigo usa `apps create-deployment`, nao update de spec.
#
# App vivo: shopman-alpha / 40b86e35-bafe-4a1a-a1b0-e124d3d9fd0f.
# Storefront publico de teste: https://alpha.nelsonboulangerie.com.br.
# Backstage/API/Admin permanecem em *.boulangerie.com.br.
