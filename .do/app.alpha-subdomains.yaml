services:
- alerts:
  - operator: GREATER_THAN
    rule: CPU_UTILIZATION
    value: 80
    window: FIVE_MINUTES
  - operator: GREATER_THAN
    rule: MEM_UTILIZATION
    value: 85
    window: FIVE_MINUTES
  - operator: GREATER_THAN
    rule: RESTART_COUNT
    value: 2
    window: TEN_MINUTES
  dockerfile_path: Dockerfile
  git:
    branch: main
    repo_clone_url: https://github.com/nelsonboulangerie/django-shopman.git
  health_check:
    failure_threshold: 5
    http_path: /ready/
    initial_delay_seconds: 30
    period_seconds: 10
    success_threshold: 1
    timeout_seconds: 5
  http_port: 8000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  liveness_health_check:
    failure_threshold: 3
    http_path: /health/
    initial_delay_seconds: 30
    period_seconds: 30
    success_threshold: 1
    timeout_seconds: 5
  name: web
  run_command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
  source_dir: /
- alerts:
  - operator: GREATER_THAN
    rule: RESTART_COUNT
    value: 2
    window: TEN_MINUTES
  build_command: npm ci && npm run build
  envs:
  - key: NUXT_DJANGO_BASE_URL
    scope: RUN_TIME
    value: https://api.boulangerie.com.br
    type: GENERAL
  - key: NUXT_APP_BASE_URL
