# ── Apps de operador: DOIS services, não oito (ADR-030, decisão de 17/09) ──
# Cada service é um contêiner com os `.output/` do grupo e um roteador por Host
# (surfaces/operator-router). O ingress manda os hostnames de sempre para o
# service do grupo; o roteador entrega ao Nitro do app. Hostnames, rotas, PWAs
# e cookies não mudam para quem usa.
#
# ENVS POR APP — os apps leem os MESMOS nomes de sempre (`NUXT_*`):
#   - chave SEM prefixo → chega a TODOS os apps do grupo (e as do nível do app,
#     lá em cima, também — como já chegavam a cada service);
#   - `<APP>__<CHAVE>` → chega SÓ àquele app, como `<CHAVE>`. APP é o id em
#     maiúsculas: POS, KDS, ORDERS, PRODUCTION, HUB (chão) · MARKETING, BI,
#     PURCHASE (gestão). Prefixo de app de outro grupo ou desconhecido
#     (`PDV__NUXT_...`) derruba o boot, alto.
#   - `OPERATOR_HOSTS` diz qual hostname é de qual app; app sem host derruba o boot.
#
# SAÚDE: o roteador responde `/health/live` (e `/health/ready`) para a sonda da
# plataforma agregando os filhos — 200 só se TODOS estiverem de pé e o
# `/health/live` de cada um responder 200. No hostname de um app, o mesmo
# caminho é do app. Ver a ADR-030 para a troca de isolamento por custo.
- alerts:
  - operator: GREATER_THAN
    rule: CPU_UTILIZATION
    value: 80
    window: FIVE_MINUTES
  - operator: GREATER_THAN
    rule: MEM_UTILIZATION
    value: 80
    window: FIVE_MINUTES
  - operator: GREATER_THAN
    rule: RESTART_COUNT
    value: 2
    window: TEN_MINUTES
  envs:
  - key: OPERATOR_HOSTS
    scope: RUN_TIME
    value: 'pos=pdv.boulangerie.com.br,kds=kds.boulangerie.com.br,orders=gestor.boulangerie.com.br,production=prod.boulangerie.com.br,hub=central.boulangerie.com.br'
    type: GENERAL
  # ── do grupo (mesmo valor nos cinco apps) ──
  # Nome do SERVIÇO para o medidor de capacidade (#783): sem prefixo, de
  # propósito — os cinco processos medem o mesmo contêiner e têm de se reportar
  # como um só; com o nome de cada app sairia um alerta por app.
  - key: NUXT_OPERATOR_SERVICE_NAME
    scope: RUN_TIME
    value: 'operator-floor'
    type: GENERAL
  # Tamanho do contêiner para o medidor de capacidade quando o cgroup não é
  # legível (sandbox): sem prefixo, os cinco processos medem o mesmo contêiner.
  # TEM de acompanhar o instance_size_slug (apps-s-1vcpu-1gb-fixed = 1 GiB, 1 vCPU).
  - key: SHOPMAN_CONTAINER_MEMORY_LIMIT_BYTES
    scope: RUN_TIME
    value: '1073741824'
    type: GENERAL
  - key: SHOPMAN_CONTAINER_CPU_CORES
    scope: RUN_TIME
    value: '1'
    type: GENERAL
  - key: NUXT_DJANGO_BASE_URL
    scope: RUN_TIME
    value: 'https://api.boulangerie.com.br'
    type: GENERAL
  # MESMO valor do SHOPMAN_BFF_PROXY_SECRET do `web`: estes BFFs chamam o `api.`
  # pela rede pública e, sem o segredo, o Django grava o IP de SAÍDA do Nitro
  # na trilha de acesso de operador (SignInEvent) e no aviso "Sua conta foi
  # usada". Lido pela layer operator-kit (runtimeConfig.djangoProxySecret).
  - key: NUXT_DJANGO_PROXY_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: NUXT_APP_BASE_URL
    scope: RUN_TIME
    value: '/'
    type: GENERAL
  - key: NUXT_PUBLIC_DJANGO_BASE_URL
    scope: RUN_AND_BUILD_TIME
    value: 'https://api.boulangerie.com.br'
    type: GENERAL
  # ── PDV ──
  - key: POS__NUXT_PUBLIC_ADMIN_BASE_URL
    scope: RUN_TIME
    value: 'https://admin.boulangerie.com.br'
    type: GENERAL
  - key: POS__NUXT_PUBLIC_OPERATOR_HUB_URL
    scope: RUN_TIME
    value: 'https://central.boulangerie.com.br'
    type: GENERAL
  - key: POS__NUXT_PUBLIC_ORDERS_URL
    scope: RUN_TIME
    value: 'https://gestor.boulangerie.com.br/'
    type: GENERAL
  - key: POS__NUXT_PUBLIC_PRODUCTION_URL
    scope: RUN_TIME
    value: 'https://prod.boulangerie.com.br/'
    type: GENERAL
  # ── KDS ──
  - key: KDS__NUXT_PUBLIC_OPERATOR_HUB_URL
    scope: RUN_TIME
    value: 'https://central.boulangerie.com.br'
    type: GENERAL
  # ── Pedidos (gestor.) ──
