    value: 'https://api.boulangerie.com.br'
    type: GENERAL
  - key: NUXT_APP_BASE_URL
    scope: RUN_TIME
    value: '/'
    type: GENERAL
  # MESMO valor do SHOPMAN_BFF_PROXY_SECRET do `web`: prova ao Django que o
  # pedido veio deste BFF, para o IP gravado ser o do cliente e não o do Nitro.
  - key: NUXT_DJANGO_PROXY_SECRET
    scope: RUN_TIME
    type: SECRET
  health_check:
    failure_threshold: 5
