# ⛔ `alpha.` e `staging.` estão MORTOS desde o corte de 01/09/2026, sem alias e
#    para sempre. Nunca re-adicionar: já aconteceu uma vez, por um update feito a
#    partir de snapshot velho.
# 🌐 O SITE é `www.nelsonboulangerie.com.br` desde 17/09/2026 (decisão do dono):
#    o domínio sem www e `boulangerie.com.br` redirecionam para ele. O `menu.`
#    voltou para o cardápio antigo (app `nb-catalog-app`), porque é para lá que
#    os links divulgados apontam; depois do go-live ele também vem para o site.
