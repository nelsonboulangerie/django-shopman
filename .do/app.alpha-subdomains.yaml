    value: 85
    window: FIVE_MINUTES
  - operator: GREATER_THAN
    rule: RESTART_COUNT
    value: 2
    window: TEN_MINUTES
  # Health check = liveness barata (processo atende; zero banco). O `/health/ready/`
  # (banco, cache, migrations, fila) fica para o Alpha Smoke e o diagnóstico: tirar o
  # `web` do ar por banco fora não cura o banco. Os Nuxt usam o `/health/live` do BFF,
  # que não chama o Django (WP-PERFORMANCE P1).
  health_check:
    failure_threshold: 5
    http_path: /health/live/
    initial_delay_seconds: 30
    period_seconds: 10
    success_threshold: 1
    timeout_seconds: 5
  http_port: 8000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  liveness_health_check:
    failure_threshold: 3
    http_path: /health/live/
    initial_delay_seconds: 30
    period_seconds: 30
    success_threshold: 1
    timeout_seconds: 5
  name: web
  envs:
  - key: VAPID_PRIVATE_KEY
    scope: RUN_TIME
    type: SECRET
  - key: VAPID_PUBLIC_KEY
    scope: RUN_TIME
    type: SECRET
  - key: VAPID_CLAIMS_EMAIL
    scope: RUN_TIME
    type: SECRET
  # Segredo compartilhado com os BFFs Nuxt (`storefront-nuxt` e os oito apps de
  # operador: NUXT_DJANGO_PROXY_SECRET, MESMO valor). O BFF chama o `api.` pela rede
  # pública e a borda acrescenta o IP de SAÍDA do Nitro ao X-Forwarded-For: com
  # depth=2 o Django gravava 147.182.186.185 como IP de consentimento e de
  # maioridade (medido 17/09); nos apps de operador, o mesmo IP ia para a trilha de
  # acesso (SignInEvent). Com o segredo, lê um salto a mais. Vazio = desligado.
  - key: SHOPMAN_BFF_PROXY_SECRET
    scope: RUN_TIME
    type: SECRET
  # ⚠️ `--access-log=/dev/null` NÃO é economia de log: é vazamento de segredo.
  # O access log do daphne grava o request-target CRU, com query string
  # (daphne/http_protocol.py: "path": uri), e o token dos webhooks viaja na query
  # — `?token=<EFI_WEBHOOK_TOKEN>` — porque é assim que a EFI cadastra a URL.
  # Esse token é a autenticação ÚNICA do webhook de Pix (a allowlist de IP nasce
  # vazia e o mTLS é advisory), então cada chamada legítima da EFI escrevia o
  # segredo em texto puro no stream de log da plataforma. Quem lê o log forja
  # "Pix recebido" e o pedido se paga sozinho.
  # O `before_send` do Sentry redige isso PARA O SENTRY; não faz nada pelo stdout.
  # Verbosity fica em 1: o log da APLICAÇÃO segue em INFO, só o access log morre.
  run_command: daphne -b 0.0.0.0 -p 8000 --access-log=/dev/null config.asgi:application
  image:
    registry_type: DOCR
    repository: shopman
    tag: web
    deploy_on_push:
      enabled: true
- alerts:
  - operator: GREATER_THAN
    rule: RESTART_COUNT
    value: 2
    window: TEN_MINUTES
  envs:
