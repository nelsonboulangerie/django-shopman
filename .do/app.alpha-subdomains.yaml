# Atalho do cofre: 302 para a planilha viva, servido pelo `web`
# (SHOPMAN_BACKUP_SHEET_HOST + middleware). Estava no ar e fora deste arquivo —
# um `apps update` teria apagado o domínio.
- domain: backup.boulangerie.com.br
  type: ALIAS
  zone: boulangerie.com.br
ingress:
  rules:
  - match:
      authority:
        exact: nelsonboulangerie.com.br
      path:
        prefix: /
    redirect:
      authority: www.nelsonboulangerie.com.br
      redirect_code: 301
      scheme: https
  - match:
      authority:
        exact: boulangerie.com.br
      path:
        prefix: /
    redirect:
      authority: www.nelsonboulangerie.com.br
      redirect_code: 301
      scheme: https
  # A landing antiga mandava /catalogo para o cardápio antigo; o link impresso
  # continua levando para lá enquanto o `menu.` for dele.
  - match:
      authority:
        exact: www.nelsonboulangerie.com.br
      path:
        prefix: /catalogo
    redirect:
      authority: menu.nelsonboulangerie.com.br
      redirect_code: 302
      scheme: https
      uri: /
  - component:
      name: storefront-nuxt
    match:
      authority:
        exact: www.nelsonboulangerie.com.br
      path:
        prefix: /
  - component:
      name: web
    match:
      authority:
        exact: api.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: web
    match:
      authority:
        exact: admin.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: operator-floor
    match:
      authority:
        exact: gestor.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: operator-floor
    match:
      authority:
        exact: kds.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: operator-floor
    match:
      authority:
        exact: pdv.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: operator-floor
    match:
      authority:
        exact: prod.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: operator-office
    match:
      authority:
        exact: compras.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: operator-floor
    match:
      authority:
        exact: central.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: operator-office
    match:
      authority:
        exact: mkt.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: operator-office
    match:
      authority:
        exact: bi.boulangerie.com.br
      path:
        prefix: /
  - component:
      name: web
    match:
      authority:
        exact: backup.boulangerie.com.br
      path:
        prefix: /
  # Última regra = catch-all do domínio primário.
  - component:
      name: storefront-nuxt
    match:
      path:
        prefix: /
