# ── O spec versionado ESTAVA menor que o app vivo ─────────────────────
#
# Medido em 05/09/2026: o spec tinha 73 envs, o app vivo tinha 95. As que
# faltavam aqui não estavam desligadas — estavam configuradas SÓ no painel.
# Um `doctl apps update --spec .do/app.alpha-subdomains.yaml` apagaria as 22
# de uma vez, em silêncio, e o que sumiria era: TODO o e-mail (SMTP inteiro),
# a emissão fiscal (NFC-e) e o NF-e de Compras com o certificado e-CNPJ.
#
# O bloco abaixo fecha essa diferença. Segredo continua morando no painel:
# `type: SECRET` sem `value` é o contrato do App Platform para "o valor
# cifrado que já está lá permanece" — o mesmo padrão do DJANGO_SECRET_KEY e
# das chaves da Efí acima. Nunca colar valor real de segredo aqui.
#
# Antes de qualquer `apps update`, rode `make deploy-spec-drift` — ele compara
# o vivo com este arquivo e lista o que sumiria. Ver
# docs/runbooks/conferir-spec-digitalocean.md.

# Error tracking. Sem DSN o sentry-sdk fica INERTE: o código de init em
# config/settings.py já está pronto, mas nunca liga, e um 500 no checkout só
# existe para quem estiver lendo o log do DO naquele instante. O valor é colado
# pelo dono no painel — ver docs/runbooks/ativar-sentry.md.
- key: SENTRY_DSN
  scope: RUN_TIME
  type: SECRET

# ── E-mail (SMTP) ─────────────────────────────────────────────────────
# Sem estas, o EMAIL_BACKEND cai no default `console` do settings.py: o
# Django "envia" o e-mail imprimindo no stdout e devolvendo sucesso. Nada
# falha, e ninguém recebe nada.
- key: EMAIL_BACKEND
  scope: RUN_TIME
  value: 'django.core.mail.backends.smtp.EmailBackend'
  type: GENERAL
- key: EMAIL_HOST
