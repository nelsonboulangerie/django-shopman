    type: GENERAL
  # Deploy gate + tráfego: 200 só com os cinco filhos de pé. 6 × 10 s tolera
  # um filho reiniciado pelo launcher (backoff ≤ 30 s + boot) sem tirar o grupo
  # do ar; um filho que não volta tira — e aí o grupo inteiro sai (ADR-030).
