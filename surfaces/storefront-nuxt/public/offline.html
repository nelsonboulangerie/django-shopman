<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7C3A40">
    <title>A loja ficou sem conexão</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; color: #3b2a1e; background: #fcf7ee; }
      main { width: min(100%, 420px); text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 24px 0 8px; font-family: Georgia, serif; font-size: clamp(1.8rem, 8vw, 2.4rem); line-height: 1.1; }
      p { margin: 0 auto 24px; max-width: 34ch; color: #6e5a48; line-height: 1.55; }
      button { min-height: 48px; border: 0; border-radius: 999px; padding: 0 24px; color: #f7efe0; background: #7c3a40; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #8b6b2e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/favicon.svg" alt="" width="64" height="64">
      <h1>A loja ficou sem conexão</h1>
      <p>Sem conexão agora. Assim que a internet voltar, você continua de onde parou.</p>
      <form action="/" method="get">
        <button type="submit">Tentar de novo</button>
      </form>
    </main>
  </body>
</html>
