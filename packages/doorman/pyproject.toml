[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopman-doorman"
version = "0.1.0"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
description = "Shopman Doorman — Phone-First Authentication"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    # Passkey (WebAuthn). A verificação de assertion é criptografia com formato binário
    # (CBOR + COSE + contadores anti-replay): escrever isso na unha é como escrever o próprio
    # TLS — a biblioteca de referência do ecossistema Python é a resposta certa.
    "webauthn>=2.8,<3",
]

[project.optional-dependencies]
# `shopman.doorman.api`: endpoints DRF com schema do drf-spectacular.
api = [
    "djangorestframework>=3.17,<4.0",
    "drf-spectacular>=0.29,<1.0",
]
guestman = [
    "shopman-guestman>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.5",
    "djangorestframework>=3.17,<4.0",
    "drf-spectacular>=0.29,<1.0",
    # A suíte prova a ponte de identidade com o guestman (extra `guestman`):
    # o resolvedor canônico mora lá, e os settings da suíte o configuram.
    "shopman-guestman[unfold]>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["shopman.doorman*"]

# Embarca templates/static/locale no build (sem isto o setuptools instala só os .py).
[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*", "locale/**/*.mo"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "doorman_test_settings"
pythonpath = [".", "../guestman", "../utils"]
