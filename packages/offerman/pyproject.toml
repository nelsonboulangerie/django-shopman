[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopman-offerman"
version = "0.3.0"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
description = "Shopman Offerman — Product Catalog"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "shopman-utils>=0.3.0",
    "django-taggit>=6.1,<7.0",
    "django-simple-history>=3.11,<4.0",
]

[project.optional-dependencies]
api = [
    "djangorestframework>=3.17,<4.0",
    "django-filter>=25.2,<26.0",
]
# Adaptadores que o offerman oferece aos protocolos de outros cores
# (`adapters/sku_validator.py` para o stockman, `adapters/product_info.py` para o craftsman).
stockman = [
    "shopman-stockman>=0.3.0",
]
craftsman = [
    "shopman-craftsman>=0.3.0",
]
import_export = [
    "django-import-export>=4.4,<5.0",
]
unfold = [
    "django-unfold>=0.107,<0.108",
    "django-import-export>=4.4,<5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.5",
    "djangorestframework>=3.17,<4.0",
    "django-filter>=25.2,<26.0",
    "django-import-export>=4.4,<5.0",
    "django-unfold>=0.107,<0.108",
    "shopman-stockman>=0.3.0",
    "shopman-craftsman>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["shopman.offerman*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "offerman_test_settings"
pythonpath = [".", "../utils"]
