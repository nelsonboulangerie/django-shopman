[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopman-watchman"
version = "0.2.0"
description = "Reusable health checks and route performance budgets for Django"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
authors = [
    {name = "Pablo Valentini", email = "pablondrina@gmail.com"}
]
keywords = ["django", "health-check", "liveness", "readiness", "shopman"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shopman.watchman*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "watchman_test_settings"
pythonpath = ["."]
testpaths = ["shopman/watchman/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "E402", "B008"]

[tool.coverage.run]
source = ["shopman/watchman"]
omit = ["*/tests/*"]
