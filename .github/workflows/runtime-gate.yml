name: Runtime Gate

"on":
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: ci-runtime-gate-local-secret-key
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality + deploy contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: make install

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Migrations are committed
        run: .venv/bin/python manage.py makemigrations --check --dry-run

      - name: Deploy checks
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-runtime-gate-nonprod-aB3dE5gH7jK9mN2pQ4rS6tU8vW0xY1zC20260505
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
          AUTH_DEFAULT_DOMAIN: shopman-ci.example
          DATABASE_URL: postgres://shopman:shopman@localhost:5432/shopman
          REDIS_URL: redis://localhost:6379/0
          DOORMAN_ACCESS_LINK_API_KEY: ci-doorman-access-link-key
          EFI_WEBHOOK_TOKEN: ci-efi-webhook-token
          IFOOD_WEBHOOK_TOKEN: ci-ifood-webhook-token
          MANYCHAT_API_TOKEN: ci-manychat-api-token
          MANYCHAT_WEBHOOK_SECRET: ci-manychat-webhook-secret
          # CI has no real payment credentials. Use the mock adapters with the
          # explicit staging allowance the deploy check provides for exactly this
          # case — it downgrades the payment-adapter error to W006 (non-blocking)
          # instead of demanding real EFI/Stripe secrets (and an on-disk EFI cert).
          SHOPMAN_PIX_ADAPTER: shopman.shop.adapters.payment_mock
          SHOPMAN_CARD_ADAPTER: shopman.shop.adapters.payment_mock
          SHOPMAN_ALLOW_MOCK_PAYMENT_ADAPTERS: "true"
        run: .venv/bin/python manage.py check --deploy

      # NOTA: o `release-readiness` NÃO mora aqui. Este job roda em SQLite sem
      # banco migrado (o pytest cria o dele), e o gate precisa de banco migrado
      # E semeado — `omotenashi.seed` é bloqueante e exige os 11 cenários
      # canônicos. Ele vive no Omotenashi Gate, logo depois do seed.
      # ⚠️ 15 minutos deixaram de caber. A suíte inteira (~6.500 testes) já
      # gastava 11m47s dos 15, e o seed passou a semear dois anos de histórico
      # para o "o que esperar" ter o que comparar — ~10s por chamada, e sete
      # testes chamam o seed. O primeiro PR grande depois disso estourou a 83%
      # da suíte: falha por RELÓGIO, não por teste.
      #
      # Teto apertado assim não é guardrail, é tripwire — dispara com o
      # crescimento normal da suíte e a falha não diz nada sobre o código. E
      # gate que reprova por tempo ensina a duvidar do vermelho, que é o pior
      # hábito que um gate pode criar.
      #
      # O que 25min NÃO resolvem: `make test` encadeia 13 alvos em SÉRIE. Quando
      # apertarem de novo, a resposta é paralelizar, não subir o teto outra vez.
      - name: Full test suite
        timeout-minutes: 25
        run: make test

  docker-image:
    name: Docker deploy image
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy image
        run: docker build --tag django-shopman:ci .

      # `docker build` prova que o COPY não falha, NÃO que o arquivo caiu onde o
      # código procura. O Admin serve o agente da gaveta a partir de
      # `BASE_DIR/tools/pos-drawer-agent/` (projections/pos_agent.py); se o
      # caminho divergir, o build passa verde e o defeito só aparece quando
      # alguém clica em "baixar" no balcão. Aqui o BASE_DIR é derivado do mesmo
      # jeito que o config/settings.py deriva: o pai do pacote `config`.
      - name: O agente da gaveta veio na imagem
        run: |
          docker run --rm django-shopman:ci python -c "
          import pathlib, config
          base = pathlib.Path(config.__file__).resolve().parent.parent
          alvo = base / 'tools' / 'pos-drawer-agent' / 'drawer_agent.py'
          assert alvo.is_file(), f'agente da gaveta ausente da imagem: {alvo}'
          print('ok:', alvo)
          "

  runtime-security-reliability:
    name: PostgreSQL + Redis runtime stress gate
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopman
          POSTGRES_USER: shopman
          POSTGRES_PASSWORD: shopman
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U shopman -d shopman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://shopman:shopman@localhost:5432/shopman
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: make install

      - name: Runtime stress gate
        timeout-minutes: 25
        run: make test-runtime

  # NOTE (headless): o gate "Omotenashi browser QA" vive agora em workflow próprio
  # (.github/workflows/omotenashi-gate.yml). Ele foi reescrito para a superfície que
  # de fato existe — sobe a loja Nuxt + o Django operador no CI e navega a matriz
  # Omotenashi (cliente na loja Nuxt, operador no Django). Omotenashi é 1ª classe.
