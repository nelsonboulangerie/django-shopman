name: Runtime Gate

"on":
  pull_request:
  # A fila de merge testa o RESULTADO do merge, não o branch isolado.
  # Sem este gatilho os checks obrigatórios nunca rodam no merge group
  # e a fila trava para sempre, esperando algo que não vai acontecer.
  merge_group:
  # Sem gatilho de `push` no main: a fila de merge já testou EXATAMENTE a árvore
  # que pousa, e a proteção do branch não deixa nada chegar por fora (force-push
  # bloqueado, enforce_admins ligado, checks obrigatórios exigidos). Rodar de novo
  # depois do merge era a terceira passagem da mesma suíte no mesmo código:
  # gastava runner e disputava fila com os PRs de verdade, sem provar nada.
  # ⚠️ Vale para os GATES. O `deploy-images.yml` mantém `push: main` de propósito:
  # lá o push É o deploy (publica a tag no DOCR).

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: ci-runtime-gate-local-secret-key
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality + deploy contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: make install

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Migrations are committed
        run: .venv/bin/python manage.py makemigrations --check --dry-run

      # A política ADR-015 arma pela EXISTÊNCIA da tag go-live-v1 — mas o
      # checkout do CI é raso e sem tags, então sem este fetch os checks
      # ficariam num "pré-go-live" eterno mesmo depois do go-live. Antes da
      # tag existir o fetch falha de propósito e o `||` registra o estado real.
      - name: Fetch da tag go-live-v1 (arma a politica ADR-015)
        run: |
          git fetch --force --depth=1 origin tag go-live-v1 || echo "pré-go-live: tag go-live-v1 ausente no remoto"

      # ADR-015 como máquina: pós-tag, (1) o diff do PR/merge group só pode
      # ADICIONAR arquivos em */migrations/ e (2) todo marcador DEPRECATED
      # precisa do prazo "remove by YYYY-MM-DD" válido e não vencido. Pré-tag:
      # no-op verde com uma linha de log. O terceiro check da política
      # (operação destrutiva exige marcador expand-contract) roda dentro do
      # `make test-migrations` logo abaixo.
      - name: "ADR-015: migrations append-only + DEPRECATED com prazo"
        run: .venv/bin/python scripts/check_adr015.py

      # `makemigrations --check` valida o GRAFO; ele não prova que as migrações
      # APLICAM em ordem sobre um banco vazio. A distinção não é teórica: duas
      # colisões de número aconteceram em 18/08, e o que provou nas duas vezes
      # foi o `migrate` de banco zerado — que só existia como alvo local do
      # Makefile, opcional, rodado na máquina de quem lembrava.
      #
      # Com o `strict` desligado (a fila de merge o tornou redundante), ninguém
      # é mais obrigado a estar em dia com o main, então o hábito local deixou
      # de ser garantia. Aqui ele passa a rodar na fila, contra a árvore que o
      # merge produz — que é o único lugar onde a colisão existe.
      - name: Migrations apply from an empty database
        run: make test-migrations

      # O `constraints.txt` fixa o que a IMAGEM instala, mas o `make install`
      # daqui resolve livre — então nada falhava quando os pins envelheciam. E
      # envelheceram no mesmo dia em que nasceram: o `rapidfuzz` entrou como
      # dependência de runtime depois deles e subia sem pin, porque constraints
      # limita versão e não impede instalação. Sem este passo, o drift que o
      # arquivo existe para matar volta em silêncio, e só o deploy sente.
      - name: Constraints cover the deploy image
        run: make test-constraints

      - name: Deploy checks
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-runtime-gate-nonprod-aB3dE5gH7jK9mN2pQ4rS6tU8vW0xY1zC20260505
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
          AUTH_DEFAULT_DOMAIN: shopman-ci.example
          DATABASE_URL: postgres://shopman:shopman@localhost:5432/shopman
          REDIS_URL: redis://localhost:6379/0
          DOORMAN_ACCESS_LINK_API_KEY: ci-doorman-access-link-key
          EFI_WEBHOOK_TOKEN: ci-efi-webhook-token
          IFOOD_WEBHOOK_TOKEN: ci-ifood-webhook-token
          MANYCHAT_API_TOKEN: ci-manychat-api-token
          MANYCHAT_WEBHOOK_SECRET: ci-manychat-webhook-secret
          # CI has no real payment credentials. Use the mock adapters with the
          # explicit staging allowance the deploy check provides for exactly this
          # case — it downgrades the payment-adapter error to W006 (non-blocking)
          # instead of demanding real EFI/Stripe secrets (and an on-disk EFI cert).
          SHOPMAN_PIX_ADAPTER: shopman.shop.adapters.payment_mock
          SHOPMAN_CARD_ADAPTER: shopman.shop.adapters.payment_mock
          SHOPMAN_ALLOW_MOCK_PAYMENT_ADAPTERS: "true"
        run: .venv/bin/python manage.py check --deploy

      # NOTA: o `release-readiness` NÃO mora aqui. Este job roda em SQLite sem
      # banco migrado (o pytest cria o dele), e o gate precisa de banco migrado
      # E semeado — `omotenashi.seed` é bloqueante e exige os 11 cenários
      # canônicos. Ele vive no Omotenashi Gate, logo depois do seed.

  # ── Gate da meia-correção (NÃO-BLOQUEANTE por ora) ───────────────────────
  # Pega a contradição interna: um arquivo que o PR tocou e que, ao mesmo tempo,
  # sabe RELATAR falha (create_operator_alert / record_*_failure / logger.error /
  # raise de erro de domínio) e ENGOLE calado noutra linha (`except: pass`,
  # `except → logger.debug`, `.catch(() => {})`, `catch {}`).
  #
  # A suíte inteira já roda em todo PR e não pega isto — não é o tipo de coisa
  # que um teste ausente revela. É o remédio que não foi distribuído: cada
  # sessão conserta o site reportado e o irmão idêntico sobrevive calado.
  #
  # ⚠️ `continue-on-error: true` DE PROPÓSITO, e é para sair. Medido em
  # 05/09/2026: 50 arquivos de produção já estão nessa contradição, com 94 sites
  # mudos. Um gate que nasce reprovando 50 arquivos é desligado no primeiro dia,
  # e aí não guarda nem os arquivos novos.
  #
  # Ele vira REQUIRED quando o placar de docs/reference/silencio-inventario.md
  # zerar as faixas `dinheiro` e `fiscal` — que são 6 arquivos, não 50. Quem
  # zerar a última linha dessas duas faixas: apague este `continue-on-error`,
  # e peça ao dono para marcar o check como obrigatório na branch protection
  # (é a mão dele no GitHub, não a nossa).
  #
  # Enquanto isso ele não bloqueia nada, mas o relatório aparece no log do PR e
  # ensina o autor onde o irmão ficou para trás — que é metade do trabalho.
  silent-swallow-gate:
    name: Gate da meia-correção (não-bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Checkout
        # O gate faz diff contra o commit-base do payload do evento, e sabe
        # buscá-lo por SHA num checkout raso. `fetch-depth: 0` fica assim mesmo
        # por ser mais barato e mais limpo: com o histórico já aqui, o gate não
        # precisa do fetch — e `git fetch --depth=1` num clone completo o
        # tornaria raso de efeito colateral.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Sem `make install`: o gate é `ast` + `re` da biblioteca padrão, e não
      # importa nada do Django. Instalar a suíte aqui custaria 3 min para provar
      # o que 2 segundos provam.
      - name: Gate da meia-correção
        # `set -o pipefail` não é zelo: o shell default do runner é `bash -e`,
        # SEM pipefail, então `gate | tee` devolveria o código do `tee` (sempre
        # 0) e o gate passaria verde para sempre. Hoje isso seria invisível
        # porque o job é `continue-on-error`; no dia em que ele virar required,
        # seria um check obrigatório que não guarda nada — o mesmo defeito que
        # este gate existe para caçar, dentro do próprio gate.
        run: |
          set -o pipefail
          python scripts/check_silent_swallow.py | tee -a "$GITHUB_STEP_SUMMARY"

  # O gate canônico do Admin/Unfold (CLAUDE.md trata como lei) só existia como
  # alvo local — agente que não roda `make admin` mergeava dívida em silêncio.
  # Aqui ele passa a rodar em todo PR e na fila de merge.
  admin-gate:
    name: Admin/Unfold gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: make install

      - name: Admin canonical gate + Admin/Unfold tests
        run: make admin

  # ⚠️ A suíte roda em MATRIZ, em job próprio. Antes vivia dentro do `quality`,
  # encadeando 13 alvos: ~1 min de cores + ~12 de framework, um esperando o
  # outro — e o gate inteiro levava 18 min. Em paralelo o relógio passa a ser o
  # alvo mais lento, não a soma.
  #
  # A cobertura é a MESMA: os mesmos alvos, todos, só que ao mesmo tempo. E o
  # `quality` fica com lint, migrações e deploy-check, que respondem em minutos
  # e reprovam cedo o erro bobo.
  tests:
    name: Testes
    runs-on: ubuntu-latest
    # ⚠️ O relógio do step precisa de folga sobre a suíte mais lenta: em
    # 27/08 o test-backstage passou VERDE em 20min04s e o timeout de 20 min
    # derrubou o job — suíte verde virou check vermelho e a fila de merge
    # expulsou PR inocente (#361). O job cobre install (~3 min) + step.
    #
    # O backstage saiu desta matriz e virou dois shards logo abaixo: ele era o
    # caminho crítico do gate inteiro (12min26s a 12min55s, contra ~5 min do
    # segundo colocado). Aqui ficaram as suítes que já respondem em minutos.
    timeout-minutes: 35
    strategy:
      # `fail-fast: false` de propósito: quando duas frentes quebram, quero ver
      # as duas no mesmo relatório. Parar na primeira esconde a segunda e custa
      # mais um ciclo inteiro para descobri-la.
      fail-fast: false
      matrix:
        suite: [test-cores, test-shop, test-storefront, test-counter-agent]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: make install

      - name: ${{ matrix.suite }}
        timeout-minutes: 30
        run: make ${{ matrix.suite }}

  # ── O backstage roda em DOIS shards, sob um nome só ────────────────────
  # `Testes (test-backstage)` é check OBRIGATÓRIO em `main`. Trocar as entradas
  # da matriz por dois nomes novos faria esse nome nunca mais aparecer — e check
  # obrigatório AUSENTE trava o PR para sempre, todos eles, inclusive o que faz
  # a troca. Por isso os shards correm em jobs próprios (não obrigatórios) e um
  # agregador com o NOME ANTIGO reprova por eles.
  #
  # ⚠️ `needs:` que falha PULA o dependente, e job pulado conta como SUCESSO
  # para branch protection — o agregador viraria um gate que não guarda nada.
  # Daí o `if: always()` e a conferência explícita de `needs.*.result`.
  tests-backstage-shards:
    name: Backstage ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [seed, rest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: make install

      - name: test-backstage-${{ matrix.shard }}
        timeout-minutes: 30
        run: make test-backstage-${{ matrix.shard }}

  # O nome deste job é o CONTRATO com a branch protection. Não renomeie sem
  # trocar o contexto obrigatório antes — ver o comentário acima.
  tests-backstage:
    name: Testes (test-backstage)
    runs-on: ubuntu-latest
    needs: tests-backstage-shards
    if: always()
    timeout-minutes: 5

    steps:
      - name: Os dois shards do backstage passaram
        run: |
          resultado='${{ needs.tests-backstage-shards.result }}'
          echo "shards: $resultado"
          # `success` é o único resultado aceitável — a comparação é por
          # igualdade, não uma lista de falhas conhecidas. `failure`,
          # `cancelled` e `skipped` reprovam sem precisar ser enumerados, e um
          # resultado novo que o GitHub venha a inventar reprova também. Este
          # job existe porque o caminho contrário (deixar o `needs:` pular o
          # dependente) faria a branch protection ler "skipped" como verde.
          [ "$resultado" = "success" ] || exit 1

  docker-image:
    name: Docker deploy image
    runs-on: ubuntu-latest
    # ⚠️ SEM `needs: quality`. Não depende do resultado dos testes — é
    # checagem independente. Encadear empurrava ~5 min para o fim do caminho
    # crítico sem proteger nada: se os testes quebram, o PR reprova igual.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build deploy image
        run: docker build --tag django-shopman:ci .

      # `docker build` prova que o COPY não falha, NÃO que o arquivo caiu onde o
      # código procura. O Admin serve o agente do balcão a partir de
      # `BASE_DIR/tools/pos-counter-agent/` (projections/pos_agent.py); se o
      # caminho divergir, o build passa verde e o defeito só aparece quando
      # alguém clica em "baixar" no balcão. Aqui o BASE_DIR é derivado do mesmo
      # jeito que o config/settings.py deriva: o pai do pacote `config`.
      - name: O agente do balcão veio na imagem
        run: |
          docker run --rm django-shopman:ci python -c "
          import pathlib, config
          base = pathlib.Path(config.__file__).resolve().parent.parent
          alvo = base / 'tools' / 'pos-counter-agent' / 'counter_agent.py'
          assert alvo.is_file(), f'agente do balcão ausente da imagem: {alvo}'
          print('ok:', alvo)
          "

  runtime-security-reliability:
    name: PostgreSQL + Redis runtime stress gate
    runs-on: ubuntu-latest
    # ⚠️ SEM `needs: quality`. Não depende do resultado dos testes — é
    # checagem independente. Encadear empurrava ~5 min para o fim do caminho
    # crítico sem proteger nada: se os testes quebram, o PR reprova igual.
    #
    # O timeout do JOB precisa exceder o do step (25 min abaixo) — com 20 o
    # job matava antes e os 25 do step eram letra morta.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopman
          POSTGRES_USER: shopman
          POSTGRES_PASSWORD: shopman
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U shopman -d shopman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://shopman:shopman@localhost:5432/shopman
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: make install

      - name: Runtime stress gate
        timeout-minutes: 25
        run: make test-runtime

  # NOTE (headless): o gate "Omotenashi browser QA" vive agora em workflow próprio
  # (.github/workflows/omotenashi-gate.yml). Ele foi reescrito para a superfície que
  # de fato existe — sobe a loja Nuxt + o Django operador no CI e navega a matriz
  # Omotenashi (cliente na loja Nuxt, operador no Django). Omotenashi é 1ª classe.
