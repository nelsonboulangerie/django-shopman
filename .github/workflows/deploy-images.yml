name: Deploy Images

# Builda as imagens do deployment no Actions e publica no DOCR
# (registry.digitalocean.com/nelsonboulangerie/shopman, tags por componente).
# O build é SELETIVO: só o que o push tocou rebuilda (a mudança de 1 surface
# builda 1 imagem). Quem transforma a imagem em deployment depende do spec vivo
# (ver o passo "Um deployment para o run inteiro", no job `manifest`):
# `deploy_on_push` ligado = cada tag móvel publicada cria o SEU deployment (até
# 4 por run); desligado = este workflow cria UM, depois de publicar tudo. Serialização por construção: concurrency sem cancel — dois merges
# seguidos publicam em ordem, nunca em corrida.
#
# Apps de operador (ADR-030): moram em DOIS services, `operator-floor` e
# `operator-office`, cada um uma imagem com os `.output/` do grupo e um
# roteador por Host. Os grupos são lidos de `surfaces/operator-router/groups.json`
# — a MESMA lista que o launcher usa; não há segunda cópia aqui.

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      components:
        description: "Componentes (csv) ou 'all'"
        default: "all"
        required: false
      per_app_images:
        description: >-
          Publicar também as imagens POR APP de operador (pos, kds...)?
          'auto' segue OPERATOR_PER_APP_IMAGES abaixo.
        type: choice
        options: ["auto", "true", "false"]
        default: "auto"

# ⚠️ `cancel-in-progress: false` protege o run EM ANDAMENTO — e só ele. O GitHub
# guarda UM assento de espera por grupo: chegando um run novo enquanto outro já
# aguarda, o que aguardava é CANCELADO, sem nunca ter rodado um job. Medido em
# 17/09/2026 numa leva de três merges: o run do #814 nasceu 23:44:20Z e o do
# #815 foi cancelado 23:44:21Z, com 0 jobs; o #814 então esperou até 23:48:37Z
# porque o #816 só terminou 23:48:33Z — a serialização funcionava, o assento
# único é que atropelava. Das 431 execuções deste workflow, 9 foram canceladas,
# TODAS com zero jobs, todas pela fila de merge.
#
# O cancelamento em si não é o defeito a consertar: o commit do run morto entra
# no `main` de qualquer jeito e o run seguinte pode cobri-lo — desde que meça
# contra o último deploy que DEU CERTO, e não contra o commit anterior. É isso
# que `scripts/deploy_components.py` faz. Serializar continua certo; presumir
# que o run anterior publicou é que era a mentira.
concurrency:
  group: deploy-images
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com
  IMAGE: registry.digitalocean.com/nelsonboulangerie/shopman
  # Rede de rollback da ADR-030, DESLIGADA em 30/09/2026. Enquanto esteve
  # "true" (desde 17/09 15:54 UTC), cada push publicava também as 8 imagens por
  # app (`pos`, `kds`, ...) para que reaplicar o spec anterior (8 services)
  # subisse a versão atual. Desligada porque ninguém as consome, e isso foi
  # MEDIDO, não presumido:
  #
  #   · o spec vivo (`doctl apps spec get`) tem 8 componentes de imagem, todos
  #     nas tags `web`, `storefront`, `operator-floor` e `operator-office`;
  #   · os dois specs de `.do/` idem, e o `Dockerfile.operator-group` constrói
  #     cada app num estágio próprio, sem puxar imagem por app do registry;
  #   · de 23/09 a 30/09, 384 deployments por push, nenhum causado por tag por
  #     app (a última foi 17/09 15:43 UTC).
  #
  # O rollback para 8 services segue possível, só não é mais instantâneo:
  # dispatch com `per_app_images=true` republica as imagens por app do topo.
  OPERATOR_PER_APP_IMAGES: "false"

jobs:
  changes:
    name: O que mudou
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Para PERGUNTAR qual foi o último deploy bem-sucedido. Sem isto o passo
      # abaixo devolve base vazia e o workflow constrói TUDO — seguro, e caro.
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
      per_app: ${{ steps.matrix.outputs.per_app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ⚠️ Histórico INTEIRO, e não o `fetch-depth: 1` default. A base pode
          # estar vários commits atrás quando um run do meio morreu, e comparar
          # contra um sha que não está no clone não erra: mente.
          fetch-depth: 0

      # ⚠️ AQUI morava o defeito de 17/09/2026. O `dorny/paths-filter` comparava
      # com `github.event.before` — o commit IMEDIATAMENTE anterior — assumindo
      # que todo commit anterior teve deploy bem-sucedido. O run do #815 foi
      # cancelado no assento de espera da `concurrency` (ver o comentário lá em
      # cima) e o run seguinte comparou justamente com ELE: os 11 arquivos de
      # `surfaces/pos-nuxt/**` daquele commit sumiram da conta, a imagem do PDV
      # não foi construída por run nenhum, e tudo ficou verde.
      #
      # A base honesta é o último run de PUSH bem-sucedido que seja ancestral do
      # topo. Se o do meio morreu, a base recua sozinha e a leva inteira volta
      # para a conta.
      #
      # ⚠️ `event=push` não é detalhe. `workflow_dispatch` publica um subconjunto
      # escolhido à mão — foi a remediação de 17/09, `components=pos-nuxt,
      # operator-floor` — e tomá-lo por base declararia publicado tudo o que
      # ninguém publicou. Um dispatch nunca vira base; no máximo faz o run
      # seguinte reconstruir algo que já estava no ar, que é o lado barato.
      - name: Contra quem medir (último deploy que deu certo)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          candidatos=$(gh api \
            "repos/${REPO}/actions/workflows/deploy-images.yml/runs" \
            -X GET -f branch=main -f event=push -f status=success -f per_page=30 \
            --jq ".workflow_runs[] | select(.id != ${RUN_ID}) | .head_sha" || true)
          base=""
          for sha in ${candidatos}; do
            if git merge-base --is-ancestor "${sha}" "${GITHUB_SHA}" 2>/dev/null; then
              base="${sha}"
              break
            fi
          done
          if [ -z "${base}" ]; then
            echo "::warning::nenhum deploy de push bem-sucedido e ancestral do" \
                 "topo foi encontrado — o passo seguinte constrói TUDO, porque" \
                 "publicar demais custa minutos e publicar de menos deixou o" \
                 "PDV fora do ar em 17/09/2026."
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "base do deploy: ${base:-<nenhuma>} | topo: ${GITHUB_SHA}"

      # A tabela de caminhos por componente mora no script, e é a MESMA que o
      # confronto com o registry consulta lá embaixo. Duas cópias divergiriam no
      # primeiro dia em que alguém acrescentasse uma surface.
      - name: Build matrix
        id: matrix
        run: |
          python3 scripts/deploy_components.py \
            --head "${GITHUB_SHA}" \
            --base "${{ steps.base.outputs.base }}" \
            --components "${{ github.event.inputs.components }}" \
            --per-app "${{ github.event.inputs.per_app_images }}" \
            >> "$GITHUB_OUTPUT"

  build-push:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    # 45 e não 30: a imagem de grupo constrói até 5 apps Nuxt (com
    # max-parallelism 2, abaixo) quando o cache do GHA está frio.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Cinco builds Nuxt ao mesmo tempo no runner padrão (7 GB) é OOM
          # esperando para acontecer. Dois por vez; os estágios por app seguem
          # com cache próprio.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Login no DOCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build e push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # MAXMIND_LICENSE_KEY: a base GeoLite2-City (cidade aproximada na tela
          # "Segurança e dados" da loja) é baixada no build da imagem `web`, e o
          # build é ESTE — o App Platform só puxa a imagem pronta do DOCR. Por
          # isso a chave mora nos segredos do GitHub Actions, e não no painel da
          # DO: env BUILD_TIME de lá nunca chega aqui. Vazio = a imagem sobe sem
          # a base e a tela degrada para navegador e data (falha suave, ver
          # scripts/fetch-geolite2.sh). As imagens Nuxt ignoram o arg.
          # O valor do arg entra na chave de cache da camada: ligar ou trocar a
          # chave invalida a camada da base sozinho, sem bump de snapshot.
          build-args: |
            SURFACE=${{ matrix.surface }}
            OPERATOR_GROUP=${{ matrix.group }}
            MAXMIND_LICENSE_KEY=${{ secrets.MAXMIND_LICENSE_KEY }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.tag }}
            ${{ env.IMAGE }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # Sem provenance/SBOM: o buildx v6 embrulha a tag num índice OCI de
          # attestation, e o App Platform espera manifest de imagem puro — a
          # tag apontava para 4 kB de attestation e a imagem real (centenas de
          # MB) ficava sem tag. Visto no primeiro push, 26/08.
          provenance: false
          sbom: false

      # ⚠️ O digest é a ÚNICA correlação honesta entre "este run publicou" e
      # "este deployment subiu". O App Platform aponta o spec para a tag MÓVEL
      # (`web`, `pos`), então o deployment não carrega o SHA — mas o
      # `cause_details.docr_push.image_digest` carrega o digest exato. Sem isso,
      # o smoke pós-deploy só sabe comparar RELÓGIO, e relógio aceita o
      # deployment do merge anterior.
      - name: Registrar o que este componente publicou
        run: |
          mkdir -p published
          cat > "published/${{ matrix.tag }}.json" <<EOF
          {
            "name": "${{ matrix.name }}",
            "tag": "${{ matrix.tag }}",
            "immutable_tag": "${{ matrix.tag }}-${{ github.sha }}",
            "digest": "${{ steps.build.outputs.digest }}"
          }
          EOF
          cat "published/${{ matrix.tag }}.json"

      - name: Subir o manifesto do componente
        uses: actions/upload-artifact@v7
        with:
          name: published-${{ matrix.tag }}
          path: published/${{ matrix.tag }}.json
          retention-days: 7

  manifest:
    name: O que foi publicado
    # ⚠️ Roda SEMPRE que o `changes` decidiu — inclusive quando não há o que
    # construir. É essa a diferença entre o smoke pós-deploy SABER que nada foi
    # publicado e ele PRESUMIR isso depois de esperar 900s por um deployment que
    # nunca vem. Presunção é o que produzia falso verde: se a DigitalOcean
    # falhasse em criar o deployment de uma publicação real, o silêncio era lido
    # como "push só de documentação".
    needs: [changes, build-push]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    # 25 e não 5: no modo de deployment único este job espera o deployment
    # ficar ACTIVE (medido em 14 d: p90 de 235 s entre criar e terminar), com
    # teto de 15 min dentro do passo.
    timeout-minutes: 25
    steps:
      - name: Baixar os manifestos dos componentes
        uses: actions/download-artifact@v8
        with:
          pattern: published-*
          path: parts
          merge-multiple: true
        continue-on-error: true

      - name: Compor o manifesto do run
        env:
          RUN_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build-push.result }}
          ANY: ${{ needs.changes.outputs.any }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib

          partes = sorted(pathlib.Path("parts").glob("*.json")) if pathlib.Path("parts").is_dir() else []
          componentes = [json.loads(p.read_text()) for p in partes]

          # ⚠️ Um componente sem digest é pior que componente nenhum: o smoke
          # não teria como correlacionar e cairia no mesmo "presumo que deu
          # certo". Falha aqui, alto, onde ainda dá para ver a causa.
          sem_digest = [c["tag"] for c in componentes if not c.get("digest")]
          if sem_digest:
              raise SystemExit(f"::error::componentes sem digest: {sem_digest}")

          esperado = os.environ["ANY"] == "true"
          if esperado and not componentes:
              raise SystemExit(
                  "::error::o `changes` disse que havia componente a publicar e "
                  "nenhum manifesto chegou. O smoke pós-deploy não pode adivinhar."
              )

          manifesto = {
              "sha": os.environ["RUN_SHA"],
              "build_result": os.environ["BUILD_RESULT"],
              "components": componentes,
          }
          pathlib.Path("published.json").write_text(json.dumps(manifesto, indent=2))
          print(json.dumps(manifesto, indent=2))
          EOF

      # ⚠️ UM deployment por run, e não um por tag. Com `deploy_on_push` ligado,
      # cada tag móvel publicada (`web`, `storefront`, `operator-floor`,
      # `operator-office`) dispara o próprio deployment, e o seguinte cancela o
      # anterior. Medido de 23 a 30/09/2026: 384 deployments por push para ~22
      # runs por dia, rajadas de 9 a 11, 184 cancelados em 7 dias.
      #
      # A forma é `POST /v2/apps/{id}/deployments` (o `doctl apps
      # create-deployment`) aqui, depois que o manifesto provou que tudo foi
      # publicado, e NÃO `apps update` com o spec apontando para o digest:
      # `update` SUBSTITUI a configuração viva, e um spec errado congelou este
      # app por 21 horas em 29/09. Criar deployment não escreve spec nenhum: a
      # App Platform resolve as tags móveis no instante do deployment, e elas já
      # apontam para o que este run publicou.
      #
      # O modo não é flag: é lido do spec VIVO, que é quem decide o que dispara.
      #   · todos os componentes de imagem com deploy_on_push → a DO já implanta
      #     por tag; criar mais um aqui seria o 5º deployment. Só registra.
      #   · nenhum com deploy_on_push → cria UM e espera ACTIVE. Precisa do
      #     segredo DIGITALOCEAN_APP_DEPLOY_TOKEN (escopo app read+update): o
      #     DIGITALOCEAN_ACCESS_TOKEN é registry + app read, e dá 403 aqui.
      #   · metade e metade → reprova. Metade do app andaria por tag e metade
      #     por este passo, e nenhum dos dois modos seria verdade.
      #
      # Não conseguir LER o spec também reprova: sem saber o modo, pular pode
      # deixar tudo publicado e nada no ar, e esse silêncio é o que este
      # workflow existe para não produzir.
      - name: Um deployment para o run inteiro
        env:
          DO_READ_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_DEPLOY_TOKEN: ${{ secrets.DIGITALOCEAN_APP_DEPLOY_TOKEN }}
          DO_APP_NAME: ${{ vars.DO_APP_NAME }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, time, urllib.error, urllib.request

          API = "https://api.digitalocean.com/v2"
          manifesto_path = pathlib.Path("published.json")
          manifesto = json.loads(manifesto_path.read_text())

          def chamar(metodo, caminho, token, corpo=None):
              dados = json.dumps(corpo).encode() if corpo is not None else None
              req = urllib.request.Request(
                  f"{API}{caminho}", data=dados, method=metodo,
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def gravar(**campos):
              manifesto.update(campos)
              manifesto_path.write_text(json.dumps(manifesto, indent=2))

          if not manifesto["components"]:
              print("nada publicado neste run: não há o que implantar.")
              gravar(deploy_mode="nothing_published")
              raise SystemExit(0)

          nome = os.environ.get("DO_APP_NAME", "")
          leitura = os.environ.get("DO_READ_TOKEN", "")
          if not nome or not leitura:
              raise SystemExit(
                  "::error::sem DO_APP_NAME ou DIGITALOCEAN_ACCESS_TOKEN não dá "
                  "para ler o spec vivo, e sem ele não se sabe se a DO implanta "
                  "sozinha ou se este passo tem de implantar."
              )
          apps = chamar("GET", "/apps?per_page=200", leitura).get("apps") or []
          app = next((a for a in apps if (a.get("spec") or {}).get("name") == nome), None)
          if not app:
              raise SystemExit(f"::error::app '{nome}' não existe na conta.")
          spec = app["spec"]

          por_push, sem_push = [], []
          for tipo in ("services", "workers", "jobs"):
              for comp in spec.get(tipo) or []:
                  imagem = comp.get("image")
                  if not imagem:
                      continue
                  ligado = (imagem.get("deploy_on_push") or {}).get("enabled")
                  (por_push if ligado else sem_push).append(comp["name"])
          print(f"deploy_on_push ligado: {por_push or '-'} | desligado: {sem_push or '-'}")

          if por_push and sem_push:
              raise SystemExit(
                  "::error::o spec vivo tem deploy_on_push ligado em parte dos "
                  f"componentes ({por_push}) e desligado em outra ({sem_push}). "
                  "Ligue em todos ou desligue em todos."
              )
          if por_push:
              print(
                  "::notice::deploy_on_push ligado no spec vivo: a DigitalOcean "
                  "cria um deployment por tag publicada. Este passo não cria outro."
              )
              gravar(deploy_mode="deploy_on_push")
              raise SystemExit(0)

          implantar = os.environ.get("DO_DEPLOY_TOKEN", "")
          if not implantar:
              raise SystemExit(
                  "::error::deploy_on_push está desligado no spec vivo e o segredo "
                  "DIGITALOCEAN_APP_DEPLOY_TOKEN não existe. As imagens foram "
                  "publicadas e NADA vai ao ar até alguém criar o deployment."
              )
          app_id = app["id"]
          try:
              criado = chamar("POST", f"/apps/{app_id}/deployments", implantar,
                              {"force_build": False})["deployment"]
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"::error::a DigitalOcean recusou criar o deployment: {exc}")
          dep_id = criado["id"]
          print(f"deployment {dep_id} criado para {manifesto['sha']}")

          prazo = time.monotonic() + 900
          fase = criado.get("phase")
          while fase not in ("ACTIVE", "ERROR", "CANCELED", "SUPERSEDED"):
              if time.monotonic() >= prazo:
                  break
              time.sleep(15)
              fase = chamar("GET", f"/apps/{app_id}/deployments/{dep_id}", leitura)["deployment"].get("phase")
              print(f"{time.strftime('%H:%M:%SZ', time.gmtime())}  {fase}")

          gravar(deploy_mode="single_deployment",
                 deployment={"id": dep_id, "app_id": app_id, "phase": fase})
          if fase != "ACTIVE":
              raise SystemExit(
                  f"::error::o deployment {dep_id} terminou em {fase}: o que este "
                  "run publicou NÃO está no ar."
              )
          print(f"deployment {dep_id} ACTIVE com o que este run publicou.")
          EOF

      - name: Subir o manifesto do run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-components
          path: published.json
          retention-days: 7

  drift:
    name: Nada ficou para trás
    # ⚠️ O irmão do conserto acima, e não uma segunda cópia dele. A base por
    # último-deploy-bem-sucedido fecha a PORTA que se viu abrir (run cancelado no
    # meio da leva). Este job fecha a CLASSE: pergunta ao registry qual commit
    # está por trás de cada tag móvel — a mesma tag que o App Platform assina —
    # e cobra que esse commit CONTENHA a última mudança daquele componente.
    # Contenção, e não igualdade: republicar do topo (que foi a remediação de
    # 17/09) carrega o mesmo código e é tão bom quanto.
    #
    # Run cancelado, run falho, dispatch com o componente errado, tag apagada à
    # mão, push que o registry não guardou: tudo cai aqui do mesmo jeito, sem
    # precisar ter sido previsto. Em 17/09/2026 a diferença entre este job e o
    # silêncio foi o PDV passar a noite no ar com a versão anterior.
    #
    # Roda depois do build para conferir o registry JÁ com o que este run
    # publicou. Se o build reprovou, o vermelho já existe e já tem causa
    # nomeada — repetir a queixa aqui só empilharia ruído.
    needs: [changes, build-push]
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.build-push.result != 'failure' &&
      needs.build-push.result != 'cancelled'
    runs-on: ubuntu-latest
    # A guarda repergunta ao registry quando a primeira leitura diverge (até 4
    # vezes, 60 s entre elas), porque listagem lida logo depois de um push já
    # veio no estado anterior a ele. Só o caminho ruim paga isso, mas estourar o
    # relógio seria vermelho pela mesma classe que a repergunta existe para
    # remover.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # O confronto pergunta "qual foi o último commit que tocou este
          # componente" — pergunta que só o histórico inteiro responde.
          fetch-depth: 0

      - name: Confrontar o registry com o `main`
        id: confronto
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          PER_APP: ${{ needs.changes.outputs.per_app }}
        run: |
          set +e
          python3 scripts/check_registry_drift.py --ref "${GITHUB_SHA}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # ⚠️ Duas saídas ruins, duas reações diferentes — e a diferença é
      # deliberada. DIVERGÊNCIA é fato provado: há componente para trás, o
      # ambiente vivo não é o que o `main` diz, e deixar o smoke pós-deploy rodar
      # produziria um verde atestando a versão errada. Reprova.
      #
      # NÃO CONSEGUI PERGUNTAR (credencial, rede, resposta ilegível) é ausência
      # de prova, não prova de ausência. Reprovar aí derrubaria o deploy — e com
      # ele o smoke pós-deploy — por uma instabilidade da API da DigitalOcean.
      # Fica como aviso, visível no run, sem sequestrar a esteira. A casa perdeu
      # três dias de guarda pós-deploy em 09/2026 exatamente por um gate que
      # morria por motivo alheio ao que ele guardava.
      - name: Reprovar se houver componente para trás
        if: steps.confronto.outputs.code == '1'
        run: |
          echo "::error::o registry não está servindo o que o \`main\` pede." \
               "Os componentes e o comando de conserto saíram no passo acima."
          exit 1
