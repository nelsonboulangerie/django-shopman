name: Deploy Images

# Builda as imagens do deployment no Actions e publica no DOCR
# (registry.digitalocean.com/nelsonboulangerie/shopman, tags por componente).
# O App Platform assina cada tag com deploy_on_push: publicar a tag nova É o
# deploy — a fila compartilhada de builders da DO sai da equação, e o build é
# SELETIVO: só o que o push tocou rebuilda (a mudança de 1 surface builda 1
# imagem). Serialização por construção: concurrency sem cancel — dois merges
# seguidos publicam em ordem, nunca em corrida.
#
# Apps de operador (ADR-030): moram em DOIS services, `operator-floor` e
# `operator-office`, cada um uma imagem com os `.output/` do grupo e um
# roteador por Host. Os grupos são lidos de `surfaces/operator-router/groups.json`
# — a MESMA lista que o launcher usa; não há segunda cópia aqui.

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      components:
        description: "Componentes (csv) ou 'all'"
        default: "all"
        required: false
      per_app_images:
        description: >-
          Publicar também as imagens POR APP de operador (pos, kds...)?
          'auto' segue OPERATOR_PER_APP_IMAGES abaixo.
        type: choice
        options: ["auto", "true", "false"]
        default: "auto"

concurrency:
  group: deploy-images
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com
  IMAGE: registry.digitalocean.com/nelsonboulangerie/shopman
  # ⚠️ Rede de rollback da ADR-030, com prazo. Enquanto "true", cada push segue
  # publicando as 8 imagens por app (`pos`, `kds`, ...) ALÉM das dos grupos, para
  # que reaplicar o spec anterior (8 services) suba a versão atual e não uma
  # velha. Desligar depois de 14 dias de prova dos grupos no ar (sem
  # RESTART_COUNT, SSE de KDS/PDV reconectando): trocar para "false" num PR,
  # e só então apagar as tags por app do registry. Aplicado em: ____ (preencher
  # no dia do `apps update`); desligar a partir de: aplicado + 14 dias.
  OPERATOR_PER_APP_IMAGES: "true"

jobs:
  changes:
    name: O que mudou
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - "packages/**"
              - "shopman/**"
              - "config/**"
              - "tools/**"
              - "manage.py"
              - "pyproject.toml"
              - "constraints.txt"
              - "Dockerfile"
            kit:
              - "surfaces/operator-kit/**"
              - "surfaces/Dockerfile.surface"
            operator-group:
              - "surfaces/operator-kit/**"
              - "surfaces/operator-router/**"
              - "surfaces/Dockerfile.operator-group"
            storefront-nuxt:
              - "surfaces/storefront-nuxt/**"
              - "surfaces/Dockerfile.surface"
            pos-nuxt:
              - "surfaces/pos-nuxt/**"
            kds-nuxt:
              - "surfaces/kds-nuxt/**"
            orders-nuxt:
              - "surfaces/orders-nuxt/**"
            production-nuxt:
              - "surfaces/production-nuxt/**"
            hub-nuxt:
              - "surfaces/hub-nuxt/**"
            marketing-nuxt:
              - "surfaces/marketing-nuxt/**"
            bi-nuxt:
              - "surfaces/bi-nuxt/**"
            purchase-nuxt:
              - "surfaces/purchase-nuxt/**"

      - name: Build matrix
        id: matrix
        env:
          DISPATCH_COMPONENTS: ${{ github.event.inputs.components }}
          DISPATCH_PER_APP: ${{ github.event.inputs.per_app_images }}
          FILTER_JSON: ${{ toJSON(steps.filter.outputs) }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, pathlib

          GROUPS = {
              name: [app["surface"] for app in group["apps"]]
              for name, group in json.loads(
                  pathlib.Path("surfaces/operator-router/groups.json").read_text()
              ).items()
          }
          OPERATOR_SURFACES = [s for members in GROUPS.values() for s in members]
          SURFACES = ["storefront-nuxt", *OPERATOR_SURFACES]
          filters = json.loads(os.environ.get("FILTER_JSON") or "{}")
          asked = (os.environ.get("DISPATCH_COMPONENTS") or "").strip()
          per_app = (os.environ.get("DISPATCH_PER_APP") or "auto").strip()
          if per_app == "auto":
              per_app = os.environ.get("OPERATOR_PER_APP_IMAGES", "true")
          per_app = per_app == "true"

          if asked:
              names = (
                  ["web", *SURFACES, *GROUPS] if asked == "all"
                  else [c.strip() for c in asked.split(",") if c.strip()]
              )
          else:
              names = []
              if filters.get("web") == "true":
                  names.append("web")
              # operator-kit é layer compartilhada: mudou, TODA surface de
              # operador rebuilda (o storefront tem filtro próprio).
              kit = filters.get("kit") == "true"
              for surface in SURFACES:
                  if kit or filters.get(surface) == "true":
                      names.append(surface)
              # Grupo rebuilda se mudou o kit, o roteador, a receita do grupo
              # ou QUALQUER app dele.
              group_infra = filters.get("operator-group") == "true"
              for group, members in GROUPS.items():
                  if group_infra or any(filters.get(m) == "true" for m in members):
                      names.append(group)

          if not per_app:
              names = [n for n in names if n not in OPERATOR_SURFACES]

          include = []
          for name in dict.fromkeys(names):
              if name == "web":
                  include.append({
                      "name": "web",
                      "dockerfile": "Dockerfile",
                      "surface": "",
                      "group": "",
                      "tag": "web",
                  })
              elif name in GROUPS:
                  include.append({
                      "name": name,
                      "dockerfile": "surfaces/Dockerfile.operator-group",
                      "surface": "",
                      "group": name,
                      "tag": name,
                  })
              else:
                  include.append({
                      "name": name,
                      "dockerfile": "surfaces/Dockerfile.surface",
                      "surface": name,
                      "group": "",
                      "tag": name.removesuffix("-nuxt"),
                  })

          print("matrix=" + json.dumps({"include": include}))
          print("any=" + ("true" if include else "false"))
          EOF

  build-push:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    # 45 e não 30: a imagem de grupo constrói até 5 apps Nuxt (com
    # max-parallelism 2, abaixo) quando o cache do GHA está frio.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Cinco builds Nuxt ao mesmo tempo no runner padrão (7 GB) é OOM
          # esperando para acontecer. Dois por vez; os estágios por app seguem
          # com cache próprio.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Login no DOCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build e push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            SURFACE=${{ matrix.surface }}
            OPERATOR_GROUP=${{ matrix.group }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.tag }}
            ${{ env.IMAGE }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # Sem provenance/SBOM: o buildx v6 embrulha a tag num índice OCI de
          # attestation, e o App Platform espera manifest de imagem puro — a
          # tag apontava para 4 kB de attestation e a imagem real (centenas de
          # MB) ficava sem tag. Visto no primeiro push, 26/08.
          provenance: false
          sbom: false

      # ⚠️ O digest é a ÚNICA correlação honesta entre "este run publicou" e
      # "este deployment subiu". O App Platform aponta o spec para a tag MÓVEL
      # (`web`, `pos`), então o deployment não carrega o SHA — mas o
      # `cause_details.docr_push.image_digest` carrega o digest exato. Sem isso,
      # o smoke pós-deploy só sabe comparar RELÓGIO, e relógio aceita o
      # deployment do merge anterior.
      - name: Registrar o que este componente publicou
        run: |
          mkdir -p published
          cat > "published/${{ matrix.tag }}.json" <<EOF
          {
            "name": "${{ matrix.name }}",
            "tag": "${{ matrix.tag }}",
            "immutable_tag": "${{ matrix.tag }}-${{ github.sha }}",
            "digest": "${{ steps.build.outputs.digest }}"
          }
          EOF
          cat "published/${{ matrix.tag }}.json"

      - name: Subir o manifesto do componente
        uses: actions/upload-artifact@v7
        with:
          name: published-${{ matrix.tag }}
          path: published/${{ matrix.tag }}.json
          retention-days: 7

  manifest:
    name: O que foi publicado
    # ⚠️ Roda SEMPRE que o `changes` decidiu — inclusive quando não há o que
    # construir. É essa a diferença entre o smoke pós-deploy SABER que nada foi
    # publicado e ele PRESUMIR isso depois de esperar 900s por um deployment que
    # nunca vem. Presunção é o que produzia falso verde: se a DigitalOcean
    # falhasse em criar o deployment de uma publicação real, o silêncio era lido
    # como "push só de documentação".
    needs: [changes, build-push]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar os manifestos dos componentes
        uses: actions/download-artifact@v8
        with:
          pattern: published-*
          path: parts
          merge-multiple: true
        continue-on-error: true

      - name: Compor o manifesto do run
        env:
          RUN_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build-push.result }}
          ANY: ${{ needs.changes.outputs.any }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib

          partes = sorted(pathlib.Path("parts").glob("*.json")) if pathlib.Path("parts").is_dir() else []
          componentes = [json.loads(p.read_text()) for p in partes]

          # ⚠️ Um componente sem digest é pior que componente nenhum: o smoke
          # não teria como correlacionar e cairia no mesmo "presumo que deu
          # certo". Falha aqui, alto, onde ainda dá para ver a causa.
          sem_digest = [c["tag"] for c in componentes if not c.get("digest")]
          if sem_digest:
              raise SystemExit(f"::error::componentes sem digest: {sem_digest}")

          esperado = os.environ["ANY"] == "true"
          if esperado and not componentes:
              raise SystemExit(
                  "::error::o `changes` disse que havia componente a publicar e "
                  "nenhum manifesto chegou. O smoke pós-deploy não pode adivinhar."
              )

          manifesto = {
              "sha": os.environ["RUN_SHA"],
              "build_result": os.environ["BUILD_RESULT"],
              "components": componentes,
          }
          pathlib.Path("published.json").write_text(json.dumps(manifesto, indent=2))
          print(json.dumps(manifesto, indent=2))
          EOF

      - name: Subir o manifesto do run
        uses: actions/upload-artifact@v7
        with:
          name: published-components
          path: published.json
          retention-days: 7
