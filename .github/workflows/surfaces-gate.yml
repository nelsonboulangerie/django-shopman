name: Surfaces Gate

# Rede de segurança das superfícies Nuxt: vitest + typecheck para CADA app de
# surfaces/ (incluindo o layer operator-kit, dono dos guardrails de design system
# que leem os tailwind.css dos apps irmãos). Roda em TODO pull_request, sem
# paths filter: os jobs são required checks do main, e required check que não
# reporta (workflow pulado pelo filtro) trava o merge para sempre.
#
# Node 22 SEMPRE (buildpack DigitalOcean = node 22; locks regenerados com outro
# node quebram `npm ci` no deploy — ver memória do projeto).

"on":
  pull_request:
  # A fila de merge testa o RESULTADO do merge, não o branch isolado.
  # Sem este gatilho os checks obrigatórios nunca rodam no merge group
  # e a fila trava para sempre, esperando algo que não vai acontecer.
  merge_group:
  # Sem gatilho de `push` no main: a fila de merge já testou EXATAMENTE a árvore
  # que pousa, e a proteção do branch não deixa nada chegar por fora (force-push
  # bloqueado, enforce_admins ligado, checks obrigatórios exigidos). Rodar de novo
  # depois do merge era a terceira passagem da mesma suíte no mesmo código:
  # gastava runner e disputava fila com os PRs de verdade, sem provar nada.
  # ⚠️ Vale para os GATES. O `deploy-images.yml` mantém `push: main` de propósito:
  # lá o push É o deploy (publica a tag no DOCR).

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        app:
          - operator-kit
          - storefront-nuxt
          - pos-nuxt
          - kds-nuxt
          - orders-nuxt
          - production-nuxt
          - purchase-nuxt
          - hub-nuxt
          - marketing-nuxt
          - bi-nuxt

    defaults:
      run:
        working-directory: surfaces/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            surfaces/${{ matrix.app }}/package-lock.json
            surfaces/operator-kit/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Apps que estendem a layer resolvem módulos ('vue', '@vueuse/core') a
      # partir do node_modules da própria operator-kit no typecheck — sem este
      # install, hub/production falham com TS2307.
      - name: Install operator-kit layer deps
        if: matrix.app != 'operator-kit' && matrix.app != 'storefront-nuxt'
        working-directory: surfaces/operator-kit
        run: npm ci

      - name: Vitest
        run: npm test

      # `--if-present`: o operator-kit (layer, sem app Nuxt próprio) não tem
      # typecheck; todos os 6 apps têm — storefront e pos ganharam o script
      # junto com este gate.
      - name: Typecheck
        run: npm run typecheck --if-present

  marketing-complete:
    name: Marketing — cadeia completa
    # Os screenshots foram revisados em macOS e usam o Chromium pinado pelo
    # Playwright. Fixar ambos evita aprovar ruído de rasterização entre sistemas.
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: surfaces/marketing-nuxt

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # O backend hermético dos fluxos E2E usa sintaxe Python 3.10+ e o runner
      # macOS não oferece uma versão contratada por default. Sem o setup, o
      # processo pode morrer antes de abrir a porta e o Playwright só relata um
      # timeout opaco de 30 s. O runtime do projeto já é Python 3.12.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            surfaces/marketing-nuxt/package-lock.json
            surfaces/operator-kit/package-lock.json

      - name: Install operator-kit layer dependencies
        working-directory: surfaces/operator-kit
        run: npm ci

      - name: Install deterministic Marketing dependencies
        run: npm ci

      - name: Install pinned Playwright Chromium
        run: npx playwright install chromium

      - name: Unit and component tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Browser E2E
        env:
          MARKETING_E2E_MANAGED: "1"
        run: npm run test:e2e

      - name: Accessibility
        env:
          MARKETING_E2E_MANAGED: "1"
          MARKETING_E2E_USERNAME: operadora-e2e
          MARKETING_E2E_PASSWORD: senha-sintetica-ci
        run: npm run test:a11y

      - name: Visual regression matrix
        run: npm run test:visual

      - name: Security contracts
        run: npm run test:security

      - name: Audit operator-kit supply chain
        working-directory: surfaces/operator-kit
        run: npm audit --audit-level=high

      - name: Audit Marketing supply chain
        run: npm audit --audit-level=high

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketing-browser-gates
          path: surfaces/marketing-nuxt/test-results
          if-no-files-found: ignore
          retention-days: 14
