name: Surfaces Gate

# Rede de segurança das superfícies Nuxt: vitest + typecheck para CADA app de
# surfaces/ (incluindo o layer operator-kit, dono dos guardrails de design system
# que leem os tailwind.css dos apps irmãos). Roda em TODO pull_request, sem
# paths filter: os jobs são required checks do main, e required check que não
# reporta (workflow pulado pelo filtro) trava o merge para sempre.
#
# Node 22 SEMPRE (buildpack DigitalOcean = node 22; locks regenerados com outro
# node quebram `npm ci` no deploy — ver memória do projeto).

"on":
  pull_request:
  # A fila de merge testa o RESULTADO do merge, não o branch isolado.
  # Sem este gatilho os checks obrigatórios nunca rodam no merge group
  # e a fila trava para sempre, esperando algo que não vai acontecer.
  merge_group:
  # Sem gatilho de `push` no main: a fila de merge já testou EXATAMENTE a árvore
  # que pousa, e a proteção do branch não deixa nada chegar por fora (force-push
  # bloqueado, enforce_admins ligado, checks obrigatórios exigidos). Rodar de novo
  # depois do merge era a terceira passagem da mesma suíte no mesmo código:
  # gastava runner e disputava fila com os PRs de verdade, sem provar nada.
  # ⚠️ Vale para os GATES. O `deploy-images.yml` mantém `push: main` de propósito:
  # lá o push É o deploy (publica a tag no DOCR).

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  surface-contract:
    name: Contrato canônico das superfícies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.matrix.outputs.quality }}
      pwa: ${{ steps.matrix.outputs.pwa }}
      audit: ${{ steps.matrix.outputs.audit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validar manifestos, capabilities e exceções
        run: node scripts/surface_contract.mjs validate
      - name: Gerar matrizes por capability
        id: matrix
        run: |
          echo "quality=$(node scripts/surface_contract.mjs matrix quality)" >> "$GITHUB_OUTPUT"
          echo "pwa=$(node scripts/surface_contract.mjs matrix pwa)" >> "$GITHUB_OUTPUT"
          echo "audit=$(node scripts/surface_contract.mjs matrix audit)" >> "$GITHUB_OUTPUT"

  # Deriva de versão entre as superfícies. Roda ANTES da matriz e em segundos:
  # é leitura de `package.json` + `package-lock.json`, sem `npm ci`, sem rede.
  #
  # Por que é um job próprio e não um passo da matriz: a pergunta é sobre a
  # RELAÇÃO entre os apps ("todos na mesma versão?"), e um passo dentro do job
  # de um app só enxerga aquele app. Deriva entre irmãos é invisível de dentro
  # de qualquer um deles.
  surface-versions:
    name: Versões das superfícies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Só a biblioteca padrão: o guard lê JSON e compara números. Sem `pip
      # install`, sem constraints — este job não pode depender do ambiente
      # Python do deploy para responder uma pergunta sobre arquivos npm.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Gate de versões
        run: python scripts/check_surface_versions.py

      # Mesma natureza de pergunta (RELAÇÃO entre os apps, não um app só) e mesmo
      # custo: leitura de arquivo. Superfície nova que falte em qualquer lugar
      # inventariado reprova aqui com o nome do arquivo. Os specs da DO e os
      # workflows são YAML, daí o único pacote instalado.
      - name: Gate do registro de superfícies
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check_surface_registry.py

      - name: Gate de componentes canônicos do operador
        run: python scripts/check_operator_component_ledger.py

      - name: Gate de atalhos globais do operador
        run: python scripts/check_operator_shortcuts.py

      - name: Gate de layouts e tokens do operador
        run: python scripts/check_operator_layout_guardrails.py

      # O tema compartilhado do kit (app.config.ts + CSS de tokens) é herdado por
      # extends; mexer nele reapinta as baselines visuais das apps consumidoras. O
      # contrato registra o fingerprint aceito e o gate reprova quando o tema muda
      # sem que as baselines afetadas sejam regeradas no MESMO PR, com aceite do
      # dono. Baseline não se regenera cego — ver o relatório de saúde do Marketing.
      - name: Gate do tema compartilhado x baselines consumidoras
        run: python scripts/check_theme_baseline_contract.py

  # Supply chain: o `npm audit` das superfícies Nuxt vive aqui, não dentro do job de
  # um app. Antes, o audit do operator-kit rodava no job "Marketing — cadeia completa"
  # (o Marketing instala a layer e era o único job macOS com o kit à mão). Efeito
  # medido: o Marketing ficava vermelho por dívida TRANSITIVA do toolchain Nuxt do kit
  # — simple-git/node-forge via @nuxt/devtools/listhen — que não é dele. O check de
  # Marketing deixava de significar Marketing, e um vermelho crônico e alheio é pior
  # que nenhum check.
  #
  # O audit NÃO precisa de `node_modules`: `npm audit` lê o `package-lock.json` e a
  # API do registry. Por isso este job é checkout + Node + leitura — sem `npm ci`,
  # sem build e sem macOS. A allowlist versionada (`surfaces/npm-audit-allowlist.json`)
  # é a única exceção, e cada entrada tem prazo e motivo.
  supply-chain:
    name: Supply chain — ${{ matrix.id }}
    needs: surface-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.surface-contract.outputs.audit) }}

    defaults:
      run:
        working-directory: surfaces/${{ matrix.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit ${{ matrix.id }} supply chain
        run: node ../../scripts/check_npm_audit_gate.mjs --audit-level=high --allowlist=../npm-audit-allowlist.json

  app-quality:
    name: ${{ matrix.kind == 'internal' && format('Preview interno — {0}', matrix.dir) || matrix.dir }}
    needs: surface-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.surface-contract.outputs.quality) }}

    defaults:
      run:
        working-directory: surfaces/${{ matrix.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            surfaces/${{ matrix.dir }}/package-lock.json
            surfaces/operator-kit/package-lock.json

      - name: Set up Python for declared browser mock
        if: matrix.python_mock
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Apps que estendem a layer resolvem módulos da própria operator-kit já
      # no `nuxt prepare` do postinstall. Portanto o kit precisa existir antes
      # do `npm ci` da surface, não apenas antes do typecheck.
      - name: Install operator-kit layer deps
        if: matrix.install_layer
        working-directory: surfaces/operator-kit
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" unit

      - name: Component tests
        if: matrix.component
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" component

      # `eslint .` roda a partir do diretório de cada app e NUNCA alcança
      # `../operator-kit`. Resultado: o layer — BFF (`server/utils/djangoProxy.ts`),
      # composables, 24 componentes, 176 arquivos — era o único código de surfaces
      # que jamais via ESLint, enquanto ditava a base de lint dos nove apps. O kit
      # ganhou `eslint.config.mjs` e `lint` próprios; este passo tira o lint de
      # opt-in (só Marketing e Produção o rodavam, nos seus jobs de browser).
      # `--if-present` pelo mesmo motivo do typecheck: mantém a matriz uniforme.
      - name: Lint
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" lint

      # `--if-present`: o operator-kit (layer, sem app Nuxt próprio) não tem
      # typecheck; todos os 6 apps têm — storefront e pos ganharam o script
      # junto com este gate.
      - name: Typecheck
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" typecheck

      - name: Build do catálogo canônico
        if: matrix.catalog
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" build

      - name: Install declared browser engines
        if: matrix.visual || matrix.geometry || matrix.browser || matrix.a11y || matrix.browser_suite
        run: ${{ matrix.browser_install }}

      - name: Visual and responsive contract
        if: matrix.visual && !matrix.browser_suite
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" visual

      - name: Geometry contract
        if: matrix.geometry
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" geometry

      - name: Functional browser contract
        if: matrix.browser && !matrix.browser_suite
        env:
          MARKETING_E2E_MANAGED: "1"
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" browser

      - name: Accessibility contract
        if: matrix.a11y && !matrix.browser_suite
        env:
          MARKETING_E2E_MANAGED: "1"
          MARKETING_E2E_USERNAME: operadora-e2e
          MARKETING_E2E_PASSWORD: senha-sintetica-ci
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" a11y

      - name: Shared browser contract (functional, a11y, visual)
        if: matrix.browser_suite
        env:
          MARKETING_E2E_MANAGED: "1"
          MARKETING_E2E_USERNAME: operadora-e2e
          MARKETING_E2E_PASSWORD: senha-sintetica-ci
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" browserSuite

      - name: Security contract
        if: matrix.security
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" security

      - name: Upload canonical browser evidence
        if: always() && (matrix.visual || matrix.geometry || matrix.browser || matrix.a11y || matrix.browser_suite)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}-browser-evidence
          path: surfaces/${{ matrix.dir }}/test-results
          if-no-files-found: ignore
          retention-days: 14

  pwa-quality:
    name: PWA — ${{ matrix.id }}
    needs: surface-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.surface-contract.outputs.pwa) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            surfaces/${{ matrix.dir }}/package-lock.json
            surfaces/operator-kit/package-lock.json

      - name: Install operator-kit capability dependencies
        if: matrix.install_layer
        working-directory: surfaces/operator-kit
        run: npm ci

      - name: Install surface dependencies
        working-directory: surfaces/${{ matrix.dir }}
        run: npm ci

      - name: Install declared PWA browser
        if: matrix.pwa_browser
        working-directory: surfaces/${{ matrix.dir }}
        run: npx playwright install --with-deps chromium

      - name: Production build
        working-directory: surfaces/${{ matrix.dir }}
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" build

      - name: Structural PWA gate
        run: node tools/pwa-gate/check.mjs --app=${{ matrix.id }}

      # Carga direta com SSR no build de produção (o mesmo `.output` acima), a 390 e a
      # 1440 px: nenhum mismatch de hidratação, nenhum erro de página. A matriz visual
      # do Gestor é client-only e não via a Fila presa no esqueleto (09/10/2026).
      - name: Orders SSR direct load (celular e mesa)
        if: matrix.ssr
        working-directory: surfaces/${{ matrix.dir }}
        run: |
          npx playwright install --with-deps chromium
          node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" ssr

      - name: Storefront PWA browser smoke
        if: matrix.pwa_browser
        working-directory: surfaces/${{ matrix.dir }}
        run: node ../../scripts/surface_contract.mjs run "${{ matrix.id }}" pwaBrowser

      # O deploy usa esta receita genérica, não o workspace já preparado pelo
      # job. Construí-la aqui prova a ordem real de instalação e impede que o
      # postinstall do consumer só falhe depois do merge, ao publicar no DOCR.
      - name: Log in to GHCR (espelho das imagens da CI)
        if: matrix.install_layer
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build operator deployment image
        if: matrix.install_layer
        # Base e frontend vêm do espelho da MESMA imagem oficial no GHCR do
        # repositório (ci-image-mirror.yml); o pull anônimo cai com 429 no Docker Hub
        # e no ECR público. O deploy segue no default do ARG.
        run: >-
          docker build --file surfaces/Dockerfile.surface
          --build-arg SURFACE=${{ matrix.dir }}
          --build-arg NODE_IMAGE=ghcr.io/nelsonboulangerie/ci-mirror/node:22-alpine
          --build-arg BUILDKIT_SYNTAX=ghcr.io/nelsonboulangerie/ci-mirror/dockerfile:1
          .
