name: Security Gate

"on":
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Escopo (17/11/2026, docs/reference/ci-escopo.md): PR só de documentação
  # não roda o CodeQL; fila, push e agenda rodam sempre.
  scope:
    name: Escopo do PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci_scope.py
          sparse-checkout-cone-mode: false
      - name: Escopo
        id: scope
        uses: ./.github/actions/ci-scope

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  security-gate:
    name: Security Gate
    needs: [scope, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: As duas análises produziram resultado
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          echo "CodeQL matrix: $CODEQL_RESULT" >> "$GITHUB_STEP_SUMMARY"
          # PR só de documentação pula o CodeQL de propósito; em qualquer outro
          # caso `skipped` continua reprovando.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.scope.outputs.code }}" = "false" ] && [ "$CODEQL_RESULT" = "skipped" ]; then
            exit 0
          fi
          test "$CODEQL_RESULT" = "success"
