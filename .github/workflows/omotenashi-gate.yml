name: Omotenashi Gate

# Omotenashi is a first-class passenger: hospitality on the surfaces that ACTUALLY
# exist must not regress silently. The headless cutover retired the Django customer
# pages, so the old browser-QA gate (which navigated them) was dropped. This gate
# rebuilds it against the real topology — the Nuxt customer store + the Django
# operator pages — driving the seeded Omotenashi matrix in headless Chrome.

"on":
  pull_request:
  # A fila de merge testa o RESULTADO do merge, não o branch isolado.
  # Sem este gatilho os checks obrigatórios nunca rodam no merge group
  # e a fila trava para sempre, esperando algo que não vai acontecer.
  merge_group:
  # Sem gatilho de `push` no main: a fila de merge já testou EXATAMENTE a árvore
  # que pousa, e a proteção do branch não deixa nada chegar por fora (force-push
  # bloqueado, enforce_admins ligado, checks obrigatórios exigidos). Rodar de novo
  # depois do merge era a terceira passagem da mesma suíte no mesmo código:
  # gastava runner e disputava fila com os PRs de verdade, sem provar nada.
  # ⚠️ Vale para os GATES. O `deploy-images.yml` mantém `push: main` de propósito:
  # lá o push É o deploy (publica a tag no DOCR).

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: ci-omotenashi-gate-local-secret-key
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  PYTHONUNBUFFERED: "1"

jobs:
  omotenashi-browser-qa:
    name: Browser QA (Nuxt store + Django operator)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopman
          POSTGRES_USER: shopman
          POSTGRES_PASSWORD: shopman
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U shopman -d shopman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://shopman:shopman@localhost:5432/shopman

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ⚠️ TODAS as superfícies, não só a loja. O gate agora sobe também o Gestor
      # de Pedidos, o KDS, a Produção e o PDV — sem elas de pé, os seis checks de
      # operador voltariam a ser pulados, e pular agora REPROVA em --strict.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            surfaces/operator-kit/package-lock.json
            surfaces/storefront-nuxt/package-lock.json
            surfaces/orders-nuxt/package-lock.json
            surfaces/kds-nuxt/package-lock.json
            surfaces/production-nuxt/package-lock.json
            surfaces/pos-nuxt/package-lock.json

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: make install

      # A layer primeiro: os apps de operador a estendem, e o build deles resolve
      # 'vue'/'@vueuse/core' pelo node_modules dela (mesma razão do Surfaces Gate).
      - name: Install operator-kit layer dependencies
        run: npm ci
        working-directory: surfaces/operator-kit

      - name: Install surface dependencies
        run: |
          for app in storefront-nuxt orders-nuxt kds-nuxt production-nuxt pos-nuxt; do
            (cd "surfaces/$app" && npm ci)
          done

      - name: Omotenashi browser-QA gate (strict)
        env:
          CI: "true"
          SHOPMAN_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: make omotenashi-browser-ci

      # Mora AQUI, e não no Runtime Gate, porque é o único job com banco
      # migrado E semeado (o passo acima roda `migrate` + `seed --flush`): o
      # check `omotenashi.seed` é bloqueante e exige os 11 cenários canônicos,
      # e o `gateways.local` executa fixtures de verdade contra o banco.
      #
      # Modo NÃO estrito de propósito: falha só em falha real e tolera os
      # bloqueios que dependem de credencial externa. Está no CI porque a
      # versão "roda quando alguém lembra" apagou em silêncio — o
      # gateways.local ficou ~3 semanas vermelho depois que o gate de SKU
      # untracked entrou (2026-07-24), e a última leitura verde era de 2026-06-26.
      - name: Release readiness (non-strict)
        timeout-minutes: 5
        run: make release-readiness

      # ── Seed re-entrante provado no MESMO Postgres ────────────────────
      # O staging quebrou (19-22/08/2026) num `seed --flush` que encontrou
      # curadoria pré-existente: ProductAlias CONFIRMADO com FK PROTECT para o
      # catálogo + config de terminal escrita por gente. ProtectedError no
      # meio, sem transação — banco pela metade. O CI nunca viu porque só
      # rodava seed em banco recém-criado, a única condição em que o flush não
      # encontra linha hostil. Aqui o banco já foi semeado E navegado pelo
      # gate acima; plantamos a curadoria hostil e rodamos o seed DE NOVO. As
      # linhas plantadas espelham os contratos dos testes
      # test_seed_flush_keeps_alias_curation.py / _keeps_terminal_config.py —
      # mas contra o Postgres real do job, e a curadoria tem de SOBREVIVER.
      - name: Seed re-entrante — plantar curadoria hostil
        run: .venv/bin/python scripts/check_seed_reentrancy.py plant

      - name: Seed re-entrante — segunda passada no mesmo Postgres
        run: .venv/bin/python manage.py seed --flush

      - name: Seed re-entrante — a curadoria sobreviveu
        run: .venv/bin/python scripts/check_seed_reentrancy.py assert

      - name: Upload Omotenashi QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omotenashi-browser-qa
          path: |
            /tmp/shopman-omotenashi-qa-screens
            /tmp/shopman-omotenashi-qa-browser.json
            /tmp/shopman-omotenashi-browser-ci-django.log
            /tmp/shopman-omotenashi-browser-ci-nuxt.log
          if-no-files-found: warn
          retention-days: 14

  # "DEBUG local não prova CSP": o settings relaxa o script-src com
  # 'unsafe-inline' em DEBUG, então inline que passa na máquina de dev (e nos
  # outros jobs, que rodam DJANGO_DEBUG=true) é BLOQUEADO em produção — e as
  # telas Django-rendered do Admin/Unfold são as expostas. Este job sobe o
  # Django com DJANGO_DEBUG=false + o mesmo formato de env do `check --deploy`
  # do Runtime Gate (o bloco vive em scripts/run_admin_csp_gate.sh, overridável
  # por env) e navega o Admin logado com Playwright, reprovando em QUALQUER
  # violação de CSP fora da lista de dívida (hoje VAZIA: auditoria de 26/08
  # encontrou as telas navegadas limpas) e conferindo, tela a tela, que o
  # header não traz 'unsafe-inline' no script-src.
  admin-csp:
    name: Admin CSP (production settings)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopman
          POSTGRES_USER: shopman
          POSTGRES_PASSWORD: shopman
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U shopman -d shopman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Fora de DEBUG o cache LocMem reprova no system check
      # (django_ratelimit.E003 exige cache compartilhado) — o servidor nem sobe
      # sem um Redis de verdade, exatamente como no deploy.
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://shopman:shopman@localhost:5432/shopman
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: make install

      - name: Admin CSP gate (DEBUG=false + Playwright)
        env:
          CI: "true"
        run: make admin-csp-gate

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-csp-django-log
          path: /tmp/shopman-admin-csp-django.log
          if-no-files-found: warn
          retention-days: 14

  storefront-e2e:
    name: Storefront E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ⚠️ Este alvo existia e não rodava em lugar nenhum. Foi assim que a suíte
    # ficou navegando /cart, /checkout, /login e /tracking/<ref> — rotas que a
    # loja Nuxt nunca serviu (ela serve /sacola, /finalizar, /entrar, /pedido/) —
    # e telas de operador que sumiram no cutover headless. Seis testes davam 404,
    # e um deles PASSAVA no 404 (afirmava a ausência de um texto que a página de
    # erro também não tinha). Um E2E que ninguém roda apodrece calado.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopman
          POSTGRES_USER: shopman
          POSTGRES_PASSWORD: shopman
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U shopman -d shopman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://shopman:shopman@localhost:5432/shopman

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: surfaces/storefront-nuxt/package-lock.json

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: make install

      - name: Install Nuxt store dependencies
        run: npm ci
        working-directory: surfaces/storefront-nuxt

      - name: Storefront E2E
        env:
          CI: "true"
        run: make storefront-e2e

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storefront-e2e-logs
          path: |
            /tmp/shopman-storefront-e2e-django.log
            /tmp/shopman-storefront-e2e-nuxt.log
          if-no-files-found: warn
          retention-days: 14
