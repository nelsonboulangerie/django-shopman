<div class="grid grid-cols-[44px_minmax(0,1fr)_repeat(4,92px)_1px_repeat(4,80px)] items-center h-[60px] border-b border-border cat-sel-{{sel}}">
  <div class="pl-4"><span class="size-5 rounded border-2 cat-box-{{sel}} grid place-items-center"><i data-i="check" class="size-3.5 text-primary-foreground"></i></span></div>
  <div class="pl-2 flex items-center gap-3 min-w-0">
    <span class="size-10 rounded-md grid place-items-center text-white font-semibold shrink-0" style="background:{{tint}}">{{initial}}</span>
    <div class="min-w-0">
      <p class="op-body font-medium truncate flex items-center gap-2">{{name}} <span class="cat-st cat-st-{{st}}"></span></p>
      <p class="op-micro text-muted-foreground"><span class="font-mono">{{sku}}</span> · <span class="tnum">{{price}}</span> · {{col}}</p>
    </div>
    <button class="ml-auto mr-2 size-9 rounded-md grid place-items-center text-muted-foreground"><i data-i="ellipsis-vertical" class="size-4.5"></i></button>
  </div>
  <div class="flex justify-center items-center gap-1.5"><span class="sw sw-on"></span><i data-i="circle-dollar-sign" class="size-4 text-muted-foreground"></i></div>
  <div class="flex justify-center items-center gap-1.5"><span class="sw sw-on"></span><i data-i="circle-dollar-sign" class="size-4 text-muted-foreground"></i></div>
  <div class="flex justify-center bg-primary/5 h-full items-center gap-1.5"><span class="sw sw-{{ifood}}"></span><i data-i="circle-dollar-sign" class="size-4 text-muted-foreground"></i></div>
  <div class="flex justify-center items-center gap-1.5"><span class="sw sw-on"></span><i data-i="circle-dollar-sign" class="size-4 text-muted-foreground"></i></div>
  <div class="h-full bg-border"></div>
  <div class="flex justify-center items-center gap-1.5"><span class="sw sw-on"></span></div>
  <div class="flex justify-center items-center gap-1.5"><span class="sw sw-on"></span></div>
  <div class="flex justify-center"><span class="op-micro text-muted-foreground">fora</span></div>
  <div class="flex justify-center items-center gap-1.5"><span class="sw sw-on"></span></div>
</div>
