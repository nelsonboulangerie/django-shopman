[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-shopman"
version = "0.1.0"
description = "Django Shopman — omnichannel commerce framework for Django"
license = "MIT"
authors = [
    {name = "Pablo Valentini", email = "pablondrina@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "djangorestframework>=3.17,<4.0",
    "django-filter>=25.2,<26.0",
    "drf-spectacular>=0.29,<1.0",
    # ⚠️ Piso, não capricho: o `drf-spectacular` só pede `PyYAML>=5.1`, então quando o
    # resolvedor precisa voltar atrás (o `soft-webauthn` puxa `webauthn` e o pip sai
    # procurando versão compatível) ele desce até o sdist do PyYAML 6.0 — que não compila
    # com Cython 3 e derruba a instalação inteira com
    # "'build_ext' object has no attribute 'cython_sources'". Da 6.0.1 em diante há wheel
    # para 3.12, e o caminho quebrado deixa de existir.
    "PyYAML>=6.0.1,<7.0",
    "shopman-utils>=0.3.0",
    "shopman-refs>=0.1.0",
    "shopman-orderman>=0.1.0",
    "shopman-stockman>=0.3.0",
    "shopman-craftsman>=0.3.0",
    "shopman-offerman>=0.3.0",
    "shopman-guestman>=0.1.0",
    "shopman-doorman>=0.1.0",
    "shopman-payman>=0.1.0",
    "shopman-buyman>=0.1.0",
    "shopman-fiscalman>=0.1.0",
    "anthropic>=0.117,<1.0",
    "django-ratelimit>=4.1,<5.0",
    "django-csp>=4.0,<5.0",
    "django-eventstream>=5.3,<6.0",
    "django-import-export>=4.4,<5.0",
    "django-unfold>=0.92,<0.93",
    "django-otp>=1.7,<2.0",
    "daphne>=4.2,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "redis>=5.1,<8.0",
    "qrcode[pil]>=7.4,<8.0",
    "requests>=2.31,<3.0",
    "stripe>=14,<16",
    "whitenoise>=6.11,<7.0",
    "sentry-sdk[django]>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    # Autenticador WebAuthn de software: é o único jeito de exercitar passkey sem aparelho.
    # Sem ele, o fluxo mais sensível do login ficaria com teste de fachada.
    "soft-webauthn>=0.1.4,<0.2",
    # ⚠️ O `fido2` é pinado de propósito. Ele vem do `soft-webauthn`, e o doorman já pede
    # `webauthn>=2.8,<3` — os dois disputam `cryptography` e `cbor2`. Sem faixa estreita o
    # pip explora o produto cartesiano e desiste com `resolution-too-deep`, derrubando a
    # instalação inteira. 1.2.x é o que a suíte roda de verdade.
    "fido2>=1.2,<1.3",
    "pytest",
    "pytest-django",
    "pytest-timeout>=2.3,<3.0",
    "pytest-cov",
    "pytest-playwright>=0.5,<0.8",
    "ruff>=0.15,<1.0",
]

# Teste de carga (`make load`) — fora do `dev` de propósito, e não é organização:
# o locust arrasta gevent/geventhttpclient, e resolver isso junto com o resto fazia
# o pip voltar atrás até um PyYAML antigo que não compila mais com Cython 3
# ("'build_ext' object has no attribute 'cython_sources'"). O CI não roda carga —
# só o alvo manual roda. Para usá-lo: pip install -e ".[load]".
load = [
    "locust>=2.24,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shopman*", "config*"]

[tool.pytest.ini_options]
# Settings herméticos: config.settings + pinos do baseline do CI, para que a
# suíte não dependa do env/.env do desenvolvedor (ver config/settings_test.py).
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["."]
testpaths = ["shopman/shop/tests"]
# Browser E2E (Playwright) needs TWO running servers (Nuxt store + Django API);
# deselect it from the default suite. Run it via scripts/run_storefront_e2e.sh,
# which boots both servers and re-selects with `-m browser`.
addopts = "-m 'not browser'"
markers = [
    "browser: Playwright browser E2E — requires running Nuxt store + Django API",
]

[tool.coverage.run]
source = ["shopman"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*_test_settings*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # line too long — handled by line-length setting
    "E402",   # module-level import not at top — intentional lazy imports in adapters
    "B008",   # function call in default argument — common Django pattern
]
